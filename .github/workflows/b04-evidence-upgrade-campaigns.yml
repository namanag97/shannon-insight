name: B04 Evidence Upgrade Campaigns

on:
  push:
    branches:
      - 'closure/b04-upgrade-*'
    paths:
      - research/analytics_landscape/product_families/build_evidence_upgrade_campaigns.py
      - research/analytics_landscape/product_families/organization-family-membership-claims.jsonl
      - research/analytics_landscape/product_families/organization-identity-projection.jsonl
      - research/analytics_landscape/product_families/evidence-upgrade-*.json*
      - .github/workflows/b04-evidence-upgrade-campaigns.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 research/analytics_landscape/product_families/build_evidence_upgrade_campaigns.py
      - name: Persist campaigns
        run: |
          git config user.name "shannon-insight-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/analytics_landscape/product_families/evidence-upgrade-campaigns.jsonl \
                  research/analytics_landscape/product_families/evidence-upgrade-campaign-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "closure: generate B04 evidence upgrade campaigns [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
