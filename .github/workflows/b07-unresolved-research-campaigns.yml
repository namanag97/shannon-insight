name: B07 Unresolved Research Campaigns

on:
  push:
    branches:
      - 'closure/b07-unresolved-*'
    paths:
      - research/domain_atlas/industries/build_unresolved_reference_campaigns.py
      - research/domain_atlas/industries/validate_unresolved_reference_campaigns.py
      - research/domain_atlas/industries/canonical-reference-unresolved-*.jsonl
      - research/domain_atlas/industries/canonical-reference-unresolved-campaign-summary.json
      - .github/workflows/b07-unresolved-research-campaigns.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Factor unresolved B07 queue
        run: python3 research/domain_atlas/industries/build_unresolved_reference_campaigns.py
      - name: Validate exact partition/no inferred mappings
        run: python3 research/domain_atlas/industries/validate_unresolved_reference_campaigns.py
      - name: Persist campaigns
        run: |
          git config user.name "shannon-insight-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/domain_atlas/industries/canonical-reference-unresolved-campaign-assignments.jsonl \
                  research/domain_atlas/industries/canonical-reference-unresolved-research-campaigns.jsonl \
                  research/domain_atlas/industries/canonical-reference-unresolved-campaign-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "closure: generate B07 unresolved research campaigns [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
