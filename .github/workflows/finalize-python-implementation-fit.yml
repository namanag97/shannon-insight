name: Finalize Python Implementation Fit

on:
  push:
    branches:
      - architecture/python-implementation-fit-v2-20260828
    paths:
      - .github/workflows/finalize-python-implementation-fit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and development validators
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply safe lint and formatting fixes to the new boundary surface
        run: |
          ruff check --fix \
            src/shannon_insight/core/package_identity.py \
            tests/test_package_identity.py \
            tests/research/test_python_implementation_fit.py \
            tests/research/test_python_dependency_provider_fit.py \
            tests/research/test_python_application_pipeline.py \
            research/implementation_architecture/python_product_fit/*.py
          ruff format \
            src/shannon_insight/core/package_identity.py \
            tests/test_package_identity.py \
            tests/research/test_python_implementation_fit.py \
            tests/research/test_python_dependency_provider_fit.py \
            tests/research/test_python_application_pipeline.py \
            research/implementation_architecture/python_product_fit/*.py
      - name: Regenerate deterministic machine state
        run: |
          python3 research/implementation_architecture/python_product_fit/build_module_allocation.py
          python3 research/implementation_architecture/python_product_fit/build_dependency_provider_crosswalk.py
      - name: Validate all new architecture surfaces
        run: |
          python3 research/implementation_architecture/python_product_fit/validate.py --determinism
          python3 research/implementation_architecture/python_product_fit/validate_dependency_provider_crosswalk.py --determinism
          python3 research/implementation_architecture/python_product_fit/validate_application_pipeline.py
      - name: Run focused code and research tests
        run: |
          pytest -q \
            tests/test_package_identity.py \
            tests/research/test_python_implementation_fit.py \
            tests/research/test_python_dependency_provider_fit.py \
            tests/research/test_python_application_pipeline.py
      - name: Run final lint and type checks
        run: |
          ruff check \
            src/shannon_insight/core/package_identity.py \
            tests/test_package_identity.py \
            tests/research/test_python_implementation_fit.py \
            tests/research/test_python_dependency_provider_fit.py \
            tests/research/test_python_application_pipeline.py \
            research/implementation_architecture/python_product_fit/*.py
          ruff format --check \
            src/shannon_insight/core/package_identity.py \
            tests/test_package_identity.py \
            tests/research/test_python_implementation_fit.py \
            tests/research/test_python_dependency_provider_fit.py \
            tests/research/test_python_application_pipeline.py \
            research/implementation_architecture/python_product_fit/*.py
          mypy src/shannon_insight/core/package_identity.py
      - name: Persist only validated state
        run: |
          rm .github/workflows/finalize-python-implementation-fit.yml
          git config user.name "shannon-insight-architecture-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalization changes required'
            exit 0
          fi
          git commit -m 'architecture: finalize validated Python implementation fit [skip python-fit] [skip dependency-fit]'
          git push origin HEAD:${{ github.ref_name }}
