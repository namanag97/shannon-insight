name: One-shot converge B04 Databricks evidence

on:
  push:
    branches:
      - closure/b04-databricks-exact-evidence-01
    paths:
      - .github/workflows/one-shot-converge-b04-databricks.yml
      - research/analytics_landscape/product_families/**
  workflow_dispatch:

concurrency:
  group: one-shot-b04-databricks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/b04-databricks-exact-evidence-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and validate all B04 projections
        run: |
          python3 research/analytics_landscape/product_families/build_evidence_governance.py
          python3 research/analytics_landscape/product_families/build_effective_evidence_governance.py
          python3 research/analytics_landscape/product_families/build_evidence_upgrade_campaigns.py
          python3 research/analytics_landscape/product_families/validate.py
          python3 research/analytics_landscape/product_families/validate_evidence_governance.py
          python3 research/analytics_landscape/product_families/validate_effective_evidence_governance.py
          python3 research/analytics_landscape/product_families/validate_evidence_upgrade_campaigns.py
      - name: Restore canonical workflows and remove one-shot job
        run: |
          git fetch origin main
          git checkout origin/main -- \
            .github/workflows/b04-evidence-governance.yml \
            .github/workflows/b04-evidence-upgrade-campaigns.yml
          git rm .github/workflows/one-shot-converge-b04-databricks.yml
      - name: Commit one coherent generated state
        run: |
          git config user.name 'shannon-insight-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/b04-evidence-governance.yml \
            .github/workflows/b04-evidence-upgrade-campaigns.yml \
            research/analytics_landscape/product_families/organization-family-membership-claims.jsonl \
            research/analytics_landscape/product_families/organization-identity-projection.jsonl \
            research/analytics_landscape/product_families/research-reference-role-projection.jsonl \
            research/analytics_landscape/product_families/evidence-governance-summary.json \
            research/analytics_landscape/product_families/effective-evidence-upgrade-dispositions.jsonl \
            research/analytics_landscape/product_families/effective-evidence-governance-summary.json \
            research/analytics_landscape/product_families/evidence-upgrade-campaigns.jsonl \
            research/analytics_landscape/product_families/evidence-upgrade-campaign-summary.json
          if git diff --cached --quiet; then
            echo 'B04 Databricks branch already converged'
            exit 0
          fi
          git commit -m 'research: converge Databricks exact-evidence tranche [skip b04]'
          git push origin HEAD:closure/b04-databricks-exact-evidence-01
