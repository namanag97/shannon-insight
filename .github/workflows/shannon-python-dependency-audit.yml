name: Shannon Python Dependency Audit

on:
  push:
    branches:
      - architecture/shannon-python-product-placement
    paths:
      - src/shannon_insight/**
      - research/product_ontology/implementation_placement/build_shannon_python_placement.py
      - research/product_ontology/implementation_placement/build_shannon_python_dependency_audit.py
      - research/product_ontology/implementation_placement/validate_shannon_python_dependency_audit.py
      - research/product_ontology/implementation_placement/shannon-python-dependency-*.json*
      - tests/research/test_shannon_python_dependency_audit.py
      - .github/workflows/shannon-python-dependency-audit.yml
  pull_request:
    branches:
      - main
    paths:
      - src/shannon_insight/**
      - research/product_ontology/implementation_placement/build_shannon_python_placement.py
      - research/product_ontology/implementation_placement/build_shannon_python_dependency_audit.py
      - research/product_ontology/implementation_placement/validate_shannon_python_dependency_audit.py
      - research/product_ontology/implementation_placement/shannon-python-dependency-*.json*
      - tests/research/test_shannon_python_dependency_audit.py
      - .github/workflows/shannon-python-dependency-audit.yml
  workflow_dispatch:

concurrency:
  group: shannon-python-dependency-audit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Generate placement dependency
        run: python3 research/product_ontology/implementation_placement/build_shannon_python_placement.py
      - name: Generate internal dependency audit
        run: python3 research/product_ontology/implementation_placement/build_shannon_python_dependency_audit.py
      - name: Validate internal dependency audit
        run: python3 research/product_ontology/implementation_placement/validate_shannon_python_dependency_audit.py
      - name: Run focused regression
        run: pytest -q tests/research/test_shannon_python_dependency_audit.py
      - name: Require generated artifacts in pull requests
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- \
            research/product_ontology/implementation_placement/shannon-python-dependency-audit.json \
            research/product_ontology/implementation_placement/shannon-python-dependency-edges.jsonl
      - name: Persist generated artifacts on the placement branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'shannon-insight-architecture-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research/product_ontology/implementation_placement/shannon-python-dependency-audit.json \
            research/product_ontology/implementation_placement/shannon-python-dependency-edges.jsonl
          if git diff --cached --quiet; then
            echo 'Python dependency audit already current'
            exit 0
          fi
          git commit -m 'architecture: generate Python dependency audit [skip dependency-audit]'
          git push origin HEAD:${{ github.ref_name }}
