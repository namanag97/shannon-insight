name: Python Placement Dependency Repair

on:
  push:
    branches: [ architecture/shannon-python-product-placement ]
    paths:
      - .github/workflows/python-placement-dependency-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair package-relative import resolution
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research/product_ontology/implementation_placement/build_shannon_python_dependency_audit.py')
          s = p.read_text()
          s = s.replace(
              'def resolve_from_import(current_module: str, node: ast.ImportFrom) -> str | None:\n',
              'def resolve_from_import(current_module: str, node: ast.ImportFrom, *, is_package: bool = False) -> str | None:\n'
          )
          s = s.replace(
              '    package = current_module.rsplit(".", 1)[0] if "." in current_module else current_module\n',
              '    package = current_module if is_package else (current_module.rsplit(".", 1)[0] if "." in current_module else current_module)\n'
          )
          s = s.replace(
              '                resolved = resolve_from_import(current, node)\n',
              '                resolved = resolve_from_import(current, node, is_package=path.name == "__init__.py")\n'
          )
          p.write_text(s)
          PY
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Regenerate placement and dependency audit
        run: |
          python3 research/product_ontology/implementation_placement/build_shannon_python_placement.py
          python3 research/product_ontology/implementation_placement/build_shannon_python_dependency_audit.py
          python3 research/product_ontology/implementation_placement/validate_shannon_python_dependency_audit.py
      - name: Run focused tests
        run: pytest -q tests/research/test_shannon_python_dependency_audit.py tests/research/test_shannon_python_product_placement.py
      - name: Persist repair and regenerated evidence
        run: |
          git config user.name "shannon-insight-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/product_ontology/implementation_placement/build_shannon_python_dependency_audit.py \
                  research/product_ontology/implementation_placement/shannon-python-dependency-audit.json \
                  research/product_ontology/implementation_placement/shannon-python-dependency-edges.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: resolve package-relative dependency imports [skip dependency-repair]"
          git push origin HEAD:${{ github.ref_name }}
