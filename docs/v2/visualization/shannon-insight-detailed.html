<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shannon Insight - Complete System Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --accent-indigo: #6366f1;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --accent-purple: #a855f7;
            --accent-cyan: #06b6d4;
        }

        * {
            font-family: 'Inter', -apple-system, sans-serif;
        }

        code, .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        body {
            background: var(--bg-primary);
            background-image:
                radial-gradient(ellipse at top, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-hover:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .glow-indigo { box-shadow: 0 0 60px rgba(99, 102, 241, 0.3), 0 0 100px rgba(99, 102, 241, 0.1); }
        .glow-emerald { box-shadow: 0 0 60px rgba(16, 185, 129, 0.3), 0 0 100px rgba(16, 185, 129, 0.1); }
        .glow-amber { box-shadow: 0 0 60px rgba(245, 158, 11, 0.3), 0 0 100px rgba(245, 158, 11, 0.1); }
        .glow-rose { box-shadow: 0 0 60px rgba(244, 63, 94, 0.3), 0 0 100px rgba(244, 63, 94, 0.1); }

        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .animate-gradient {
            background-size: 200% 200%;
            animation: gradient 8s ease infinite;
        }

        @keyframes gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .animate-pulse-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; filter: blur(20px); }
            50% { opacity: 0.8; filter: blur(30px); }
        }

        .data-flow-line {
            stroke-dasharray: 8 4;
            animation: dash 1s linear infinite;
        }

        @keyframes dash {
            to { stroke-dashoffset: -12; }
        }

        .layer-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .layer-card:hover {
            transform: translateX(16px) scale(1.02);
        }

        .signal-chip {
            transition: all 0.2s ease;
        }

        .signal-chip:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .finder-row {
            transition: all 0.3s ease;
        }

        .finder-row:hover {
            background: rgba(99, 102, 241, 0.1);
            padding-left: 24px;
        }

        .stage-node {
            transition: all 0.3s ease;
        }

        .stage-node:hover {
            transform: translateY(-8px);
        }

        .tensor-layer {
            transition: all 0.4s ease;
        }

        .tensor-layer:hover {
            transform: translateZ(60px) scale(1.1);
        }

        .nav-link {
            position: relative;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.5);
        }

        /* Tooltip */
        .tooltip {
            position: relative;
        }

        .tooltip .tooltip-content {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            z-index: 100;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            transition: all 0.2s ease;
        }

        .tooltip:hover .tooltip-content {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(-8px);
        }
    </style>
</head>
<body class="text-gray-100 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ============ DATA ============

        const LAYERS = [
            {
                id: 6,
                name: 'COMPOSITES',
                subtitle: 'Weighted fusion of all signals',
                color: 'rose',
                gradient: 'from-rose-500 to-pink-600',
                signals: [
                    { name: 'risk_score', formula: 'Σ wᵢ × pctl(signalᵢ)', scope: 'FILE' },
                    { name: 'wiring_quality', formula: '1 - penalties', scope: 'FILE' },
                    { name: 'health_score', formula: 'composite(risk, wiring, ...)', scope: 'FILE' },
                    { name: 'delta_h', formula: 'health - mean(neighbor_health)', scope: 'FILE' },
                    { name: 'codebase_health', formula: 'THE ONE NUMBER (1-10)', scope: 'CODEBASE' },
                ],
                description: 'Final health metrics combining all layers'
            },
            {
                id: 5,
                name: 'CROSS-LAYER',
                subtitle: 'Multi-graph comparison via mutual information',
                color: 'purple',
                gradient: 'from-purple-500 to-indigo-600',
                signals: [
                    { name: 'behavioral_coherence', formula: 'I(G_import; G_cochange)', scope: 'CODEBASE' },
                    { name: 'conway_alignment', formula: 'I(G_import; G_author)', scope: 'CODEBASE' },
                    { name: 'hidden_coupling_count', formula: '|N_cochange \\ N_import|', scope: 'FILE' },
                    { name: 'neighborhood_coherence', formula: 'Jaccard(N_imp, N_coc)', scope: 'FILE' },
                ],
                description: 'The key innovation: comparing different relationship graphs'
            },
            {
                id: 4,
                name: 'TRAJECTORY',
                subtitle: 'Time derivatives of graph signals',
                color: 'indigo',
                gradient: 'from-indigo-500 to-blue-600',
                signals: [
                    { name: 'pagerank_velocity', formula: 'd(pagerank)/dt', scope: 'FILE' },
                    { name: 'community_stability', formula: '1 - changes/observations', scope: 'FILE' },
                    { name: 'graph_velocity', formula: 'edge_jaccard(G_t, G_{t-1})', scope: 'CODEBASE' },
                    { name: 'fiedler_trend', formula: 'slope(λ₂ over time)', scope: 'CODEBASE' },
                ],
                description: 'How signals change over time'
            },
            {
                id: 3,
                name: 'GRAPH SIGNALS',
                subtitle: 'Centrality, spectral, community per relationship type',
                color: 'blue',
                gradient: 'from-blue-500 to-cyan-600',
                signals: [
                    { name: 'pagerank[r]', formula: 'PageRank(G_r)', scope: 'FILE' },
                    { name: 'betweenness[r]', formula: 'shortest_path_fraction', scope: 'FILE' },
                    { name: 'community[r]', formula: 'Louvain(G_r)', scope: 'FILE' },
                    { name: 'depth[r]', formula: 'BFS from entry points', scope: 'FILE' },
                    { name: 'blast_radius[r]', formula: '|transitive_closure(v)|', scope: 'FILE' },
                    { name: 'modularity[r]', formula: 'Louvain Q score', scope: 'CODEBASE' },
                    { name: 'fiedler[r]', formula: 'λ₂(Laplacian)', scope: 'CODEBASE' },
                    { name: 'centrality_gini[r]', formula: 'Gini(pagerank)', scope: 'CODEBASE' },
                ],
                description: 'Standard graph algorithms applied per relationship type'
            },
            {
                id: 2,
                name: 'GRAPHS',
                subtitle: '6 relationship types as adjacency matrices',
                color: 'cyan',
                gradient: 'from-cyan-500 to-teal-600',
                signals: [
                    { name: 'G_import', formula: 'a imports b', scope: 'DIRECTED' },
                    { name: 'G_cochange', formula: 'lift(a,b) > 1', scope: 'UNDIRECTED' },
                    { name: 'G_author', formula: 'Jaccard(authors) > 0.1', scope: 'UNDIRECTED' },
                    { name: 'G_semantic', formula: 'cosine(concepts) > 0.3', scope: 'UNDIRECTED' },
                    { name: 'G_clone', formula: 'NCD(a,b) < 0.3', scope: 'UNDIRECTED' },
                    { name: 'G_combined', formula: 'Σ αᵣ × G_r', scope: 'WEIGHTED' },
                ],
                description: 'Multiple views of file relationships'
            },
            {
                id: 1,
                name: 'INDEXED FACTS',
                subtitle: 'Temporal index for historical reconstruction',
                color: 'teal',
                gradient: 'from-teal-500 to-emerald-600',
                signals: [
                    { name: 'events', formula: 'Append-only event log', scope: 'SYSTEM' },
                    { name: 'node_lifecycle', formula: 'birth_ts, death_ts per file', scope: 'FILE' },
                    { name: 'edge_lifecycle', formula: 'birth_ts, death_ts per edge', scope: 'EDGE' },
                    { name: 'time_windows', formula: '4-week aggregation buckets', scope: 'SYSTEM' },
                ],
                description: 'Event-sourced temporal data'
            },
            {
                id: 0,
                name: 'RAW EXTRACTION',
                subtitle: 'Parsing source code and git history',
                color: 'emerald',
                gradient: 'from-emerald-500 to-green-600',
                signals: [
                    { name: 'FileSyntax', formula: 'tree-sitter or regex parse', scope: 'FILE' },
                    { name: 'lines, functions, classes', formula: 'Syntax counts', scope: 'FILE' },
                    { name: 'complexity, max_nesting', formula: 'Control flow analysis', scope: 'FILE' },
                    { name: 'GitCommit', formula: 'hash, timestamp, author, subject', scope: 'COMMIT' },
                    { name: 'GitFileChange', formula: 'path, change_type, additions, deletions', scope: 'CHANGE' },
                ],
                description: 'Raw facts from filesystem and git'
            },
        ];

        const FINDERS = [
            { scope: 'CODEBASE', name: 'FLAT_ARCHITECTURE', condition: 'modularity < 0.3 ∧ gini < 0.3', severity: 'medium' },
            { scope: 'MODULE', name: 'ZONE_OF_PAIN', condition: 'I > 0.7 ∧ A < 0.3 ∧ D > 0.5', severity: 'high' },
            { scope: 'MODULE', name: 'ZONE_OF_USELESSNESS', condition: 'I < 0.3 ∧ A > 0.7', severity: 'medium' },
            { scope: 'MODULE', name: 'BOUNDARY_MISMATCH', condition: 'boundary_alignment < 0.7', severity: 'medium' },
            { scope: 'MODULE', name: 'KNOWLEDGE_SILO', condition: 'gini > 0.7 ∨ bus_factor < 1.5', severity: 'high' },
            { scope: 'MODULE', name: 'UNSTABLE_INTERFACE', condition: 'I > 0.7 ∧ velocity > p75 ∧ A > 0.5', severity: 'high' },
            { scope: 'MODULE', name: 'RIGID_CORE', condition: 'I < 0.2 ∧ coupling > 0.5 ∧ files > 10', severity: 'medium' },
            { scope: 'PAIR', name: 'HIDDEN_COUPLING', condition: 'lift > 2.0 ∧ ¬import', severity: 'high', crossLayer: true },
            { scope: 'PAIR', name: 'CONWAY_VIOLATION', condition: 'import ∧ author_overlap < 0.2', severity: 'medium', crossLayer: true },
            { scope: 'PAIR', name: 'ACCIDENTAL_COUPLING', condition: 'concept_overlap > 0.5 ∧ ¬import', severity: 'medium', crossLayer: true },
            { scope: 'PAIR', name: 'LAYER_VIOLATION', condition: 'layer(a) < layer(b) ∧ imports(b,a)', severity: 'high' },
            { scope: 'PAIR', name: 'COPY_PASTE_CLONE', condition: 'NCD(a,b) < 0.3', severity: 'medium' },
            { scope: 'FILE', name: 'GOD_FILE', condition: 'lines > 500 ∧ (cog > p90 ∨ in_deg > p90)', severity: 'high' },
            { scope: 'FILE', name: 'ORPHAN_CODE', condition: 'is_orphan ∧ role ∉ {ENTRY, TEST}', severity: 'low' },
            { scope: 'FILE', name: 'PHANTOM_DEPENDENCY', condition: 'phantom_count > 0', severity: 'medium' },
            { scope: 'FILE', name: 'CIRCULAR_DEPENDENCY', condition: 'cycle_member = true', severity: 'high' },
            { scope: 'FILE', name: 'HIGH_RISK_HUB', condition: 'pagerank > p90 ∧ (cv > 1 ∨ bus < 2)', severity: 'critical' },
            { scope: 'FILE', name: 'WEAK_LINK', condition: 'delta_h > 0.4', severity: 'high', crossLayer: true },
            { scope: 'FILE', name: 'UNSTABLE_FILE', condition: 'trajectory ∈ {CHURNING, SPIKING}', severity: 'medium' },
            { scope: 'FILE', name: 'BUS_FACTOR_RISK', condition: 'bus_factor < 1.5 ∧ pagerank > p75', severity: 'high' },
            { scope: 'FILE', name: 'HOLLOW_CODE', condition: 'stub_ratio > 0.5 ∧ functions > 3', severity: 'low' },
            { scope: 'FILE', name: 'CHRONIC_PROBLEM', condition: 'finding persists ≥ 3 snapshots', severity: 'critical' },
        ];

        const PIPELINE_STAGES = [
            { id: 0, name: 'EXTRACT', time: '1-5min', db: 'facts.db', tables: ['file_facts', 'git_commits', 'git_file_changes'], parallel: true },
            { id: 1, name: 'INDEX', time: '30s-2min', db: 'temporal.db', tables: ['events', 'node_lifecycle', 'edge_lifecycle'], parallel: false },
            { id: 2, name: 'GRAPH', time: '40s-2min', db: 'graph.db', tables: ['graph_edges', 'graph_history'], parallel: true },
            { id: 3, name: 'SIGNALS', time: '30s-90s', db: 'signals.db', tables: ['node_signals', 'trajectory_signals', 'composite_signals'], parallel: true },
            { id: 4, name: 'PATTERNS', time: '5-60s', db: 'findings.db', tables: ['findings', 'finding_evidence'], parallel: true },
            { id: 5, name: 'SNAPSHOT', time: '5-10s', db: 'snapshots.db', tables: ['snapshots', 'snapshot_diff'], parallel: false },
        ];

        const RELATIONSHIPS = [
            { id: 'R1', name: 'IMPORTS', directed: true, source: 'Parsing', weight: '1.0', color: '#6366f1' },
            { id: 'R2', name: 'COCHANGES', directed: false, source: 'Git', weight: 'lift(a,b)', color: '#10b981' },
            { id: 'R3', name: 'AUTHOR_OVERLAP', directed: false, source: 'Git', weight: 'Jaccard', color: '#f59e0b' },
            { id: 'R4', name: 'CONCEPT_SIMILAR', directed: false, source: 'Content', weight: 'cosine', color: '#a855f7' },
            { id: 'R5', name: 'CLONE', directed: false, source: 'Content', weight: '1-NCD', color: '#f43f5e' },
            { id: 'R6', name: 'COMBINED', directed: false, source: 'Fusion', weight: 'Σαᵣwᵣ', color: '#06b6d4' },
        ];

        // ============ COMPONENTS ============

        const Navigation = ({ activeSection, setActiveSection }) => {
            const sections = ['overview', 'tensor', 'layers', 'pipeline', 'finders', 'output'];

            return (
                <nav className="fixed top-0 left-0 right-0 z-50 glass border-b border-white/5">
                    <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-lg font-bold">
                                S
                            </div>
                            <div>
                                <div className="font-semibold">Shannon Insight</div>
                                <div className="text-xs text-gray-500">System Architecture v2.0</div>
                            </div>
                        </div>
                        <div className="flex gap-6">
                            {sections.map(section => (
                                <button
                                    key={section}
                                    onClick={() => setActiveSection(section)}
                                    className={`nav-link text-sm capitalize transition-colors ${
                                        activeSection === section ? 'text-white' : 'text-gray-400 hover:text-white'
                                    }`}
                                >
                                    {section}
                                </button>
                            ))}
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="pt-32 pb-20 px-6 relative overflow-hidden">
                {/* Background glow */}
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] rounded-full bg-indigo-500/10 blur-[150px] animate-pulse-glow" />

                <div className="max-w-5xl mx-auto text-center relative">
                    <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full glass text-sm text-gray-400 mb-6">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                        Information Theory + Graph Analysis + Git History
                    </div>

                    <h1 className="text-6xl md:text-7xl font-bold mb-6">
                        <span className="gradient-text">Shannon Insight</span>
                    </h1>

                    <p className="text-xl text-gray-400 max-w-2xl mx-auto mb-10">
                        A framework for understanding codebase health through the lens of
                        <span className="text-indigo-400"> information alignment</span>
                    </p>

                    {/* Stats */}
                    <div className="flex justify-center gap-8">
                        <StatBox value="79+" label="Signals" />
                        <StatBox value="22" label="Patterns" />
                        <StatBox value="6" label="Relationship Types" />
                        <StatBox value="7" label="Signal Layers" />
                    </div>
                </div>
            </section>
        );

        const StatBox = ({ value, label }) => (
            <div className="glass rounded-2xl px-8 py-6 text-center">
                <div className="text-4xl font-bold gradient-text">{value}</div>
                <div className="text-sm text-gray-500 mt-1">{label}</div>
            </div>
        );

        const FundamentalInsight = () => (
            <section className="py-20 px-6">
                <div className="max-w-5xl mx-auto">
                    <SectionHeader
                        title="The Fundamental Insight"
                        subtitle="Code health is measurable by comparing what the code declares vs what developers actually do"
                    />

                    <div className="glass rounded-3xl p-8 glow-indigo">
                        <div className="text-center mb-10">
                            <p className="text-2xl">
                                <span className="text-indigo-400 font-semibold">Structure</span>
                                <span className="text-gray-500 mx-4">↔</span>
                                <span className="text-emerald-400 font-semibold">Behavior</span>
                            </p>
                            <p className="text-gray-400 mt-2">
                                When these graphs align, your architecture is healthy
                            </p>
                        </div>

                        <div className="grid md:grid-cols-4 gap-4">
                            <InsightCard
                                status="healthy"
                                title="Aligned"
                                formula="import ∧ cochange"
                                description="Dependencies are declared and used"
                            />
                            <InsightCard
                                status="warning"
                                title="Hidden Coupling"
                                formula="cochange ∧ ¬import"
                                description="Undeclared dependency detected"
                            />
                            <InsightCard
                                status="danger"
                                title="Dead Code"
                                formula="import ∧ ¬cochange"
                                description="Declared but never used together"
                            />
                            <InsightCard
                                status="info"
                                title="Conway Violation"
                                formula="import ∧ ¬author_overlap"
                                description="Dependency crosses team boundary"
                            />
                        </div>
                    </div>
                </div>
            </section>
        );

        const InsightCard = ({ status, title, formula, description }) => {
            const styles = {
                healthy: { bg: 'bg-emerald-500/10', border: 'border-emerald-500/30', icon: '✓', iconBg: 'bg-emerald-500' },
                warning: { bg: 'bg-amber-500/10', border: 'border-amber-500/30', icon: '⚠', iconBg: 'bg-amber-500' },
                danger: { bg: 'bg-rose-500/10', border: 'border-rose-500/30', icon: '✕', iconBg: 'bg-rose-500' },
                info: { bg: 'bg-blue-500/10', border: 'border-blue-500/30', icon: '↔', iconBg: 'bg-blue-500' },
            };

            const s = styles[status];

            return (
                <div className={`${s.bg} ${s.border} border rounded-2xl p-5 transition-transform hover:scale-105`}>
                    <div className={`w-10 h-10 ${s.iconBg} rounded-xl flex items-center justify-center text-white text-lg mb-4`}>
                        {s.icon}
                    </div>
                    <div className="font-semibold mb-1">{title}</div>
                    <div className="mono text-xs text-gray-400 mb-2">{formula}</div>
                    <div className="text-sm text-gray-500">{description}</div>
                </div>
            );
        };

        const TensorSection = () => {
            const [hoveredRel, setHoveredRel] = useState(null);

            return (
                <section id="tensor" className="py-20 px-6">
                    <div className="max-w-6xl mx-auto">
                        <SectionHeader
                            title="The Tensor"
                            subtitle="A 4-dimensional structure capturing all relationships over time"
                        />

                        <div className="glass rounded-3xl p-8">
                            <div className="text-center mb-8">
                                <span className="mono text-2xl text-gray-300">
                                    T ∈ ℝ<sup>(N × N × K × R)</sup>
                                </span>
                                <p className="text-gray-500 mt-2">
                                    Files × Files × Time Points × Relationship Types
                                </p>
                            </div>

                            <div className="flex flex-col lg:flex-row items-center justify-center gap-12">
                                {/* 3D Tensor Visualization */}
                                <div className="relative" style={{ perspective: '1200px' }}>
                                    <div
                                        className="relative transition-transform duration-500"
                                        style={{ transformStyle: 'preserve-3d', transform: 'rotateX(15deg) rotateY(-25deg)' }}
                                    >
                                        {RELATIONSHIPS.map((rel, idx) => (
                                            <div
                                                key={rel.id}
                                                className="tensor-layer absolute cursor-pointer"
                                                style={{
                                                    transform: `translateZ(${idx * 50}px) translateY(${idx * -8}px)`,
                                                    zIndex: 6 - idx,
                                                }}
                                                onMouseEnter={() => setHoveredRel(rel)}
                                                onMouseLeave={() => setHoveredRel(null)}
                                            >
                                                <div
                                                    className="w-48 h-48 rounded-xl border-2 flex items-center justify-center transition-all"
                                                    style={{
                                                        backgroundColor: `${rel.color}15`,
                                                        borderColor: hoveredRel?.id === rel.id ? rel.color : `${rel.color}40`,
                                                        boxShadow: hoveredRel?.id === rel.id ? `0 0 30px ${rel.color}40` : 'none',
                                                    }}
                                                >
                                                    <div className="grid grid-cols-6 gap-1">
                                                        {[...Array(36)].map((_, i) => (
                                                            <div
                                                                key={i}
                                                                className="w-5 h-5 rounded-sm transition-all"
                                                                style={{
                                                                    backgroundColor: Math.random() > 0.6
                                                                        ? `${rel.color}${Math.floor(40 + Math.random() * 60).toString(16)}`
                                                                        : 'rgba(255,255,255,0.03)',
                                                                }}
                                                            />
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Relationship Legend */}
                                <div className="space-y-3 min-w-[300px]">
                                    <div className="text-sm font-semibold text-gray-400 mb-4">Relationship Types (R = 6)</div>
                                    {RELATIONSHIPS.map(rel => (
                                        <div
                                            key={rel.id}
                                            className={`flex items-center gap-4 p-3 rounded-xl transition-all cursor-pointer ${
                                                hoveredRel?.id === rel.id ? 'bg-white/5' : ''
                                            }`}
                                            onMouseEnter={() => setHoveredRel(rel)}
                                            onMouseLeave={() => setHoveredRel(null)}
                                        >
                                            <div
                                                className="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold"
                                                style={{ backgroundColor: rel.color }}
                                            >
                                                {rel.id}
                                            </div>
                                            <div className="flex-1">
                                                <div className="font-medium text-sm">{rel.name}</div>
                                                <div className="text-xs text-gray-500 flex items-center gap-2">
                                                    <span className={rel.directed ? 'text-indigo-400' : 'text-emerald-400'}>
                                                        {rel.directed ? 'Directed' : 'Undirected'}
                                                    </span>
                                                    <span>•</span>
                                                    <span>w = {rel.weight}</span>
                                                </div>
                                            </div>
                                            <div className="text-xs text-gray-500">{rel.source}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Tensor equation */}
                            <div className="mt-10 text-center p-4 bg-black/30 rounded-xl">
                                <span className="mono text-sm text-gray-400">
                                    T[i, j, t, r] = weight of relationship <span className="text-purple-400">r</span> from file <span className="text-emerald-400">i</span> to file <span className="text-emerald-400">j</span> at time <span className="text-amber-400">t</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const LayerStackSection = () => {
            const [expandedLayer, setExpandedLayer] = useState(null);

            return (
                <section id="layers" className="py-20 px-6">
                    <div className="max-w-5xl mx-auto">
                        <SectionHeader
                            title="The Seven-Layer Signal Stack"
                            subtitle="Data transforms through progressive abstraction layers"
                        />

                        <div className="space-y-4">
                            {LAYERS.map((layer, idx) => (
                                <div
                                    key={layer.id}
                                    className="layer-card glass rounded-2xl overflow-hidden cursor-pointer"
                                    onClick={() => setExpandedLayer(expandedLayer === layer.id ? null : layer.id)}
                                >
                                    <div className={`bg-gradient-to-r ${layer.gradient} p-1`}>
                                        <div className="bg-[#12121a] rounded-xl p-5">
                                            <div className="flex items-center gap-4">
                                                <div className={`w-14 h-14 rounded-xl bg-gradient-to-br ${layer.gradient} flex items-center justify-center text-xl font-bold`}>
                                                    L{layer.id}
                                                </div>
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-3">
                                                        <span className="font-semibold text-lg">{layer.name}</span>
                                                        <span className="text-gray-500">•</span>
                                                        <span className="text-sm text-gray-400">{layer.subtitle}</span>
                                                    </div>
                                                    <div className="text-sm text-gray-500 mt-1">{layer.description}</div>
                                                </div>
                                                <div className="text-gray-500">
                                                    {expandedLayer === layer.id ? '−' : '+'}
                                                </div>
                                            </div>

                                            {/* Expanded signals */}
                                            {expandedLayer === layer.id && (
                                                <div className="mt-6 pt-6 border-t border-white/5">
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                        {layer.signals.map(signal => (
                                                            <div key={signal.name} className="signal-chip flex items-center gap-3 p-3 rounded-xl bg-white/5">
                                                                <span className={`px-2 py-0.5 rounded text-xs font-medium bg-${layer.color}-500/20 text-${layer.color}-300`}>
                                                                    {signal.scope}
                                                                </span>
                                                                <div className="flex-1">
                                                                    <div className="mono text-sm font-medium">{signal.name}</div>
                                                                    <div className="mono text-xs text-gray-500">{signal.formula}</div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Flow arrow */}
                        <div className="flex justify-center mt-8">
                            <div className="flex items-center gap-4 text-gray-500">
                                <span className="text-sm">Source Code + Git History</span>
                                <div className="flex items-center">
                                    <div className="w-20 h-0.5 bg-gradient-to-r from-emerald-500 to-indigo-500" />
                                    <div className="text-indigo-400">→</div>
                                </div>
                                <span className="text-sm font-semibold text-white">Codebase Health Score</span>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const PipelineSection = () => {
            const [hoveredStage, setHoveredStage] = useState(null);

            return (
                <section id="pipeline" className="py-20 px-6">
                    <div className="max-w-6xl mx-auto">
                        <SectionHeader
                            title="Pipeline Execution"
                            subtitle="Six stages, each persisted to database for auditability and recovery"
                        />

                        {/* Pipeline visualization */}
                        <div className="glass rounded-3xl p-8 mb-8">
                            <div className="relative">
                                {/* Connection line */}
                                <svg className="absolute inset-0 w-full h-full pointer-events-none" style={{ zIndex: 0 }}>
                                    <defs>
                                        <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                            <stop offset="0%" stopColor="#10b981" />
                                            <stop offset="50%" stopColor="#6366f1" />
                                            <stop offset="100%" stopColor="#a855f7" />
                                        </linearGradient>
                                    </defs>
                                    <line
                                        x1="8%"
                                        y1="50%"
                                        x2="92%"
                                        y2="50%"
                                        stroke="url(#lineGradient)"
                                        strokeWidth="3"
                                        className="data-flow-line"
                                    />
                                </svg>

                                {/* Stage nodes */}
                                <div className="relative flex justify-between">
                                    {PIPELINE_STAGES.map((stage, idx) => {
                                        const colors = ['emerald', 'teal', 'cyan', 'blue', 'indigo', 'purple'];
                                        const color = colors[idx];

                                        return (
                                            <div
                                                key={stage.id}
                                                className="stage-node flex flex-col items-center cursor-pointer"
                                                onMouseEnter={() => setHoveredStage(stage)}
                                                onMouseLeave={() => setHoveredStage(null)}
                                            >
                                                <div
                                                    className={`w-20 h-20 rounded-2xl bg-gradient-to-br from-${color}-500 to-${color}-600 flex flex-col items-center justify-center shadow-lg animate-float`}
                                                    style={{ animationDelay: `${idx * 0.15}s` }}
                                                >
                                                    <div className="text-2xl font-bold">{stage.id}</div>
                                                    {stage.parallel && (
                                                        <div className="text-[8px] bg-white/20 px-1 rounded mt-0.5">PARALLEL</div>
                                                    )}
                                                </div>
                                                <div className="mt-4 text-center">
                                                    <div className="font-semibold text-sm">{stage.name}</div>
                                                    <div className="mono text-xs text-gray-500">{stage.time}</div>
                                                </div>
                                                <div className="mt-2 px-3 py-1.5 rounded-lg bg-gray-800 mono text-xs">
                                                    {stage.db}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Hovered stage detail */}
                            {hoveredStage && (
                                <div className="mt-8 p-4 bg-white/5 rounded-xl">
                                    <div className="text-sm font-semibold mb-2">Stage {hoveredStage.id}: {hoveredStage.name}</div>
                                    <div className="text-xs text-gray-400">
                                        Tables: {hoveredStage.tables.join(', ')}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Runtime estimates */}
                        <div className="grid md:grid-cols-3 gap-4">
                            <RuntimeCard size="Small" files="<100 files" time="~30 seconds" />
                            <RuntimeCard size="Medium" files="100-1,000 files" time="~3 minutes" />
                            <RuntimeCard size="Large" files="1,000-10,000 files" time="~15 minutes" />
                        </div>
                    </div>
                </section>
            );
        };

        const RuntimeCard = ({ size, files, time }) => (
            <div className="glass rounded-2xl p-6 text-center glass-hover">
                <div className="text-lg font-semibold">{size}</div>
                <div className="text-sm text-gray-500 mb-4">{files}</div>
                <div className="text-3xl font-bold gradient-text">{time}</div>
            </div>
        );

        const FindersSection = () => {
            const [filterScope, setFilterScope] = useState('all');
            const scopes = ['all', 'FILE', 'PAIR', 'MODULE', 'CODEBASE'];

            const filteredFinders = filterScope === 'all'
                ? FINDERS
                : FINDERS.filter(f => f.scope === filterScope);

            const severityColors = {
                critical: 'bg-rose-500/20 text-rose-300 border-rose-500/30',
                high: 'bg-amber-500/20 text-amber-300 border-amber-500/30',
                medium: 'bg-blue-500/20 text-blue-300 border-blue-500/30',
                low: 'bg-gray-500/20 text-gray-300 border-gray-500/30',
            };

            const scopeColors = {
                FILE: 'bg-cyan-500/20 text-cyan-300',
                PAIR: 'bg-blue-500/20 text-blue-300',
                MODULE: 'bg-indigo-500/20 text-indigo-300',
                CODEBASE: 'bg-purple-500/20 text-purple-300',
            };

            return (
                <section id="finders" className="py-20 px-6">
                    <div className="max-w-5xl mx-auto">
                        <SectionHeader
                            title="22 Pattern Finders"
                            subtitle="Detect code health issues across all scopes"
                        />

                        {/* Scope filter */}
                        <div className="flex justify-center gap-2 mb-8">
                            {scopes.map(scope => (
                                <button
                                    key={scope}
                                    onClick={() => setFilterScope(scope)}
                                    className={`px-4 py-2 rounded-lg text-sm transition-all ${
                                        filterScope === scope
                                            ? 'bg-indigo-500 text-white'
                                            : 'glass text-gray-400 hover:text-white'
                                    }`}
                                >
                                    {scope === 'all' ? 'All' : scope}
                                    {scope !== 'all' && (
                                        <span className="ml-2 opacity-50">
                                            ({FINDERS.filter(f => f.scope === scope).length})
                                        </span>
                                    )}
                                </button>
                            ))}
                        </div>

                        {/* Finders list */}
                        <div className="glass rounded-3xl overflow-hidden">
                            <div className="grid grid-cols-12 gap-4 px-6 py-3 bg-white/5 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                <div className="col-span-2">Scope</div>
                                <div className="col-span-3">Pattern</div>
                                <div className="col-span-5">Condition</div>
                                <div className="col-span-2">Severity</div>
                            </div>

                            <div className="divide-y divide-white/5">
                                {filteredFinders.map(finder => (
                                    <div
                                        key={finder.name}
                                        className="finder-row grid grid-cols-12 gap-4 px-6 py-4 items-center"
                                    >
                                        <div className="col-span-2">
                                            <span className={`px-2 py-1 rounded text-xs font-medium ${scopeColors[finder.scope]}`}>
                                                {finder.scope}
                                            </span>
                                        </div>
                                        <div className="col-span-3">
                                            <span className="font-medium">{finder.name}</span>
                                            {finder.crossLayer && (
                                                <span className="ml-2 text-xs text-purple-400">⚡ cross-layer</span>
                                            )}
                                        </div>
                                        <div className="col-span-5 mono text-sm text-gray-400">
                                            {finder.condition}
                                        </div>
                                        <div className="col-span-2">
                                            <span className={`px-2 py-1 rounded text-xs font-medium border ${severityColors[finder.severity]}`}>
                                                {finder.severity}
                                            </span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const OutputSection = () => (
            <section id="output" className="py-20 px-6">
                <div className="max-w-4xl mx-auto">
                    <SectionHeader
                        title="Sample Output"
                        subtitle="What you get after running the analysis"
                    />

                    <div className="glass rounded-3xl p-8 glow-emerald">
                        {/* Header */}
                        <div className="flex items-start justify-between mb-8 pb-8 border-b border-white/10">
                            <div>
                                <div className="text-gray-500 text-sm mb-1">Codebase Health Score</div>
                                <div className="flex items-baseline gap-2">
                                    <span className="text-6xl font-bold gradient-text">7.2</span>
                                    <span className="text-2xl text-gray-500">/ 10</span>
                                </div>
                                <div className="flex items-center gap-2 mt-2">
                                    <span className="text-emerald-400 text-sm">↑ 0.3</span>
                                    <span className="text-gray-500 text-sm">from last snapshot</span>
                                </div>
                            </div>
                            <div className="text-right text-sm text-gray-500">
                                <div>1,247 files analyzed</div>
                                <div>4,832 commits processed</div>
                                <div>Runtime: 2m 34s</div>
                            </div>
                        </div>

                        {/* Findings */}
                        <div className="space-y-3">
                            <div className="text-sm font-semibold text-gray-400 mb-4">Top Findings (12 total)</div>

                            <OutputFinding
                                severity="critical"
                                pattern="HIGH_RISK_HUB"
                                target="src/core/engine.py"
                                evidence={['pagerank=0.94 (top 6%)', 'churn_cv=1.8', 'bus_factor=1.1']}
                            />
                            <OutputFinding
                                severity="critical"
                                pattern="HIDDEN_COUPLING"
                                target="src/api/handler.py ↔ src/db/queries.py"
                                evidence={['cochange_lift=4.2', 'no import relationship', '15 co-changes']}
                            />
                            <OutputFinding
                                severity="high"
                                pattern="ZONE_OF_PAIN"
                                target="src/core/"
                                evidence={['instability=0.82', 'abstractness=0.15', 'distance=0.67']}
                            />
                            <OutputFinding
                                severity="medium"
                                pattern="GOD_FILE"
                                target="src/legacy/monolith.py"
                                evidence={['lines=1847', 'cognitive_load=89 (top 2%)']}
                            />
                        </div>

                        {/* Trend */}
                        <div className="mt-8 pt-8 border-t border-white/10">
                            <div className="text-sm font-semibold text-gray-400 mb-4">Trend Summary</div>
                            <div className="grid grid-cols-3 gap-4 text-center">
                                <div className="p-4 rounded-xl bg-emerald-500/10">
                                    <div className="text-2xl font-bold text-emerald-400">-3</div>
                                    <div className="text-xs text-gray-500">Resolved</div>
                                </div>
                                <div className="p-4 rounded-xl bg-amber-500/10">
                                    <div className="text-2xl font-bold text-amber-400">+2</div>
                                    <div className="text-xs text-gray-500">New</div>
                                </div>
                                <div className="p-4 rounded-xl bg-rose-500/10">
                                    <div className="text-2xl font-bold text-rose-400">4</div>
                                    <div className="text-xs text-gray-500">Chronic (≥3 snapshots)</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const OutputFinding = ({ severity, pattern, target, evidence }) => {
            const styles = {
                critical: { bg: 'bg-rose-500/10', border: 'border-rose-500/30', icon: '🔴' },
                high: { bg: 'bg-amber-500/10', border: 'border-amber-500/30', icon: '🟠' },
                medium: { bg: 'bg-blue-500/10', border: 'border-blue-500/30', icon: '🟡' },
                low: { bg: 'bg-gray-500/10', border: 'border-gray-500/30', icon: '🔵' },
            };

            const s = styles[severity];

            return (
                <div className={`${s.bg} ${s.border} border rounded-xl p-4`}>
                    <div className="flex items-start gap-3">
                        <span className="text-lg">{s.icon}</span>
                        <div className="flex-1">
                            <div className="flex items-center gap-2 flex-wrap">
                                <span className="font-semibold">{pattern}</span>
                                <span className="text-gray-500">→</span>
                                <span className="mono text-sm text-gray-300">{target}</span>
                            </div>
                            <div className="flex flex-wrap gap-2 mt-2">
                                {evidence.map((e, i) => (
                                    <span key={i} className="px-2 py-0.5 rounded bg-black/30 mono text-xs text-gray-400">
                                        {e}
                                    </span>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Footer = () => (
            <footer className="py-16 px-6 border-t border-white/5">
                <div className="max-w-5xl mx-auto text-center">
                    <div className="text-4xl mb-4">🔬</div>
                    <div className="text-xl font-semibold gradient-text mb-2">Shannon Insight</div>
                    <div className="text-gray-500 text-sm mb-6">
                        Codebase Analysis Through Information Theory
                    </div>
                    <div className="mono text-xs text-gray-600">
                        T[N×N×K×R] → 6 Graphs → 79 Signals → 22 Patterns → Health Score
                    </div>
                </div>
            </footer>
        );

        const SectionHeader = ({ title, subtitle }) => (
            <div className="text-center mb-12">
                <h2 className="text-4xl font-bold mb-3">{title}</h2>
                <p className="text-gray-400 max-w-2xl mx-auto">{subtitle}</p>
            </div>
        );

        // ============ MAIN APP ============

        const App = () => {
            const [activeSection, setActiveSection] = useState('overview');

            return (
                <div className="min-h-screen">
                    <Navigation activeSection={activeSection} setActiveSection={setActiveSection} />
                    <Hero />
                    <FundamentalInsight />
                    <TensorSection />
                    <LayerStackSection />
                    <PipelineSection />
                    <FindersSection />
                    <OutputSection />
                    <Footer />
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
