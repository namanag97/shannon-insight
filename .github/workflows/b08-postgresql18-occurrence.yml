name: B08 PostgreSQL 18 Source Occurrence

on:
  push:
    branches:
      - 'closure/b08-postgresql-*'
    paths:
      - research/domain_atlas/universes/source_systems/executions/postgresql18_transactional_occurrence/**
      - research/domain_atlas/universes/source_systems/*.schema.json
      - .github/workflows/b08-postgresql18-occurrence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure PostgreSQL logical WAL
        run: |
          CID=$(docker ps --filter ancestor=postgres:18.6 -q | head -1)
          test -n "$CID"
          docker exec "$CID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET wal_level='logical';"
          docker restart "$CID"
          for i in $(seq 1 30); do
            if docker exec "$CID" pg_isready -U postgres -d postgres; then break; fi
            sleep 1
          done
          docker exec "$CID" psql -U postgres -d postgres -Atc "show wal_level" | grep '^logical$'
      - name: Install probe dependencies
        run: python -m pip install 'psycopg[binary]' jsonschema
      - name: Execute PostgreSQL occurrence probe
        env:
          PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python3 research/domain_atlas/universes/source_systems/executions/postgresql18_transactional_occurrence/run_execution.py
      - name: Validate retained occurrence and chain
        run: python3 research/domain_atlas/universes/source_systems/executions/postgresql18_transactional_occurrence/validate_execution.py
      - name: Persist evidence packet
        run: |
          git config user.name "shannon-insight-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/domain_atlas/universes/source_systems/executions/postgresql18_transactional_occurrence/probe-receipt.json \
                  research/domain_atlas/universes/source_systems/executions/postgresql18_transactional_occurrence/source-occurrence.json \
                  research/domain_atlas/universes/source_systems/executions/postgresql18_transactional_occurrence/provider-offer.json \
                  research/domain_atlas/universes/source_systems/executions/postgresql18_transactional_occurrence/access-surface.json \
                  research/domain_atlas/universes/source_systems/executions/postgresql18_transactional_occurrence/connector-capability.json \
                  research/domain_atlas/universes/source_systems/executions/postgresql18_transactional_occurrence/acquisition-plan.json \
                  research/domain_atlas/universes/source_systems/executions/postgresql18_transactional_occurrence/governed-data-cut.json \
                  research/domain_atlas/universes/source_systems/executions/postgresql18_transactional_occurrence/summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence: retain PostgreSQL 18 source occurrence and chain [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
