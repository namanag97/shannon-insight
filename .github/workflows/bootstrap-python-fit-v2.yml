name: Bootstrap Python Implementation Fit V2

on:
  push:
    branches:
      - architecture/python-implementation-fit-v2-20260828
    paths:
      - .github/workflows/bootstrap-python-fit-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import reviewed generator sources from the superseded draft
        run: |
          git fetch origin architecture/python-implementation-fit-20260828
          base=origin/architecture/python-implementation-fit-20260828
          for path in \
            research/implementation_architecture/python_product_fit/module-allocation-rules.json \
            research/implementation_architecture/python_product_fit/build_module_allocation.py \
            research/implementation_architecture/python_product_fit/validate.py
          do
            git show "$base:$path" > "$path"
          done
      - name: Bind language-role decision into manifest and validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          here = Path('research/implementation_architecture/python_product_fit')

          builder = here / 'build_module_allocation.py'
          text = builder.read_text(encoding='utf-8')
          needle = '            "module-allocation-rules.json": sha256_file(HERE / "module-allocation-rules.json"),\n'
          insert = needle + '            "language-role-and-packaging.json": sha256_file(HERE / "language-role-and-packaging.json"),\n'
          if needle not in text:
              raise SystemExit('builder manifest insertion point missing')
          builder.write_text(text.replace(needle, insert, 1), encoding='utf-8')

          validator = here / 'validate.py'
          text = validator.read_text(encoding='utf-8')
          needle = '    rules = load_json(HERE / "module-allocation-rules.json")\n'
          insert = needle + '    language_role = load_json(HERE / "language-role-and-packaging.json")\n'
          if needle not in text:
              raise SystemExit('validator language-role load insertion point missing')
          text = text.replace(needle, insert, 1)

          needle = '    if boundary["completion_claim"] is not False:\n        fail("application boundary must not claim completion")\n'
          insert = needle + '    if language_role.get("completion_claim") is not False:\n        fail("language-role decision must not claim completion")\n    if language_role.get("decision") != "RETAIN_PYTHON_AS_APPLICATION_RESEARCH_HARNESS_AND_OPTIONAL_PROVIDER_LANGUAGE_NOT_UNIVERSAL_SEMANTIC_AUTHORITY":\n        fail("Python language-role decision drift")\n    if len(language_role.get("forbidden_collapses", [])) < 8:\n        fail("Python language-role non-collapse laws are incomplete")\n'
          if needle not in text:
              raise SystemExit('validator language-role assertion insertion point missing')
          text = text.replace(needle, insert, 1)

          needle = '        "module-allocation-rules.json": sha256_file(HERE / "module-allocation-rules.json"),\n'
          insert = needle + '        "language-role-and-packaging.json": sha256_file(HERE / "language-role-and-packaging.json"),\n'
          if needle not in text:
              raise SystemExit('validator manifest insertion point missing')
          validator.write_text(text.replace(needle, insert, 1), encoding='utf-8')
          PY
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.18.0'
      - name: Build corrected implementation-fit corpus
        id: build
        shell: bash
        run: |
          set +e
          python3 research/implementation_architecture/python_product_fit/build_module_allocation.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist sources and diagnostic/generated state
        run: |
          rm .github/workflows/bootstrap-python-fit-v2.yml
          git config user.name "shannon-insight-architecture-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "architecture: generate corrected Python implementation fit [skip python-fit]"
          git push origin HEAD:${{ github.ref_name }}
      - name: Refuse unknown or unparsable ownership
        if: ${{ steps.build.outputs.status != '0' }}
        run: |
          cat research/implementation_architecture/python_product_fit/summary.json
          exit 1
      - name: Validate corrected corpus
        run: python3 research/implementation_architecture/python_product_fit/validate.py --determinism
