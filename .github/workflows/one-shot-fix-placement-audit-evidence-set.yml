name: One-shot Fix Placement Audit Evidence Set

on:
  push:
    branches:
      - architecture/shannon-python-product-placement
    paths:
      - .github/workflows/one-shot-fix-placement-audit-evidence-set.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Include every requirement evidence file in the audit digest set
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('research/product_ontology/implementation_placement/build_audit.py')
          text = path.read_text(encoding='utf-8')
          old = '''EVIDENCE_FILES = [
              "shannon-python-placement.json",
              "shannon-python-module-crosswalk.jsonl",
              "shannon-python-source-totality.json",
              "shannon-codebase-intelligence-ddd.json",
              "shannon-python-extraction-candidates.jsonl",
              "shannon-python-placement-evidence.jsonl",
              "manifest.json",
          ]'''
          new = '''EVIDENCE_FILES = [
              "shannon-python-placement.json",
              "shannon-python-module-crosswalk.jsonl",
              "summary.json",
              "shannon-python-source-totality.json",
              "shannon-codebase-intelligence-ddd.json",
              "shannon-codebase-intelligence-ddd-summary.json",
              "shannon-python-extraction-candidates.jsonl",
              "shannon-python-extraction-summary.json",
              "shannon-python-placement-evidence.jsonl",
              "shannon-python-placement-evidence-summary.json",
              "manifest.json",
          ]'''
          if old not in text:
              raise SystemExit('expected audit evidence-list source block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/one-shot-fix-placement-audit-evidence-set.yml
      - name: Persist source-model correction and remove this workflow
        run: |
          git config user.name 'shannon-insight-architecture-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/product_ontology/implementation_placement/build_audit.py \
                  .github/workflows/one-shot-fix-placement-audit-evidence-set.yml
          git commit -m 'fix: include all placement requirement evidence in audit digest set'
          git push origin HEAD:${{ github.ref_name }}
