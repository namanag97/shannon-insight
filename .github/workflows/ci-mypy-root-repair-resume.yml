name: CI Mypy Root Repair Resume

on:
  push:
    branches:
      - fix/restore-green-main-after-b07
    paths:
      - .github/workflows/ci-mypy-root-repair-resume.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse the asserted repair program and correct import placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/ci-mypy-root-repair.yml').read_text(encoding='utf-8')
          lines = workflow.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          program = dedent('\n'.join(lines[start:end]))
          exec(compile(program, 'ci-mypy-root-repair.yml::<embedded>', 'exec'), {'__name__': '__main__'})

          parser_path = Path('src/shannon_insight/syntax/parser.py')
          parser = parser_path.read_text(encoding='utf-8')
          misplaced = '\nfrom tree_sitter import Node, Parser\n'
          if parser.count(misplaced) != 1:
              raise SystemExit(f'expected one misplaced tree_sitter import, found {parser.count(misplaced)}')
          parser = parser.replace(misplaced, '\n', 1)
          anchor = 'from dataclasses import dataclass, field\n'
          if parser.count(anchor) != 1:
              raise SystemExit('parser import anchor changed')
          parser = parser.replace(anchor, anchor + '\nfrom tree_sitter import Node, Parser\n', 1)
          parser_path.write_text(parser, encoding='utf-8')
          PY
      - name: Format and retain the repair tranche
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check --fix src/ tests/
          ruff format src/ tests/
          git diff --check
          git config user.name "shannon-insight-ci-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src pyproject.toml
          git commit -m "fix: repair typed runtime and parser boundaries [skip mypy-repair]"
          git push origin HEAD:${{ github.ref_name }}
