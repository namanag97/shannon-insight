name: Macro Model Challenge Iteration 3

on:
  push:
    branches:
      - 'research/macro-model-*'
    paths:
      - research/domain_atlas/compiler/library_registry/contract_generation/semantic_decomposition/macro_model_challenge/iteration3_model.py
      - research/domain_atlas/compiler/library_registry/contract_generation/semantic_decomposition/macro_model_challenge/build_iteration3.py
      - research/domain_atlas/compiler/library_registry/contract_generation/semantic_decomposition/macro_model_challenge/validate_iteration3.py
      - .github/workflows/macro-model-challenge-iteration3.yml
  pull_request:
    paths:
      - research/domain_atlas/compiler/library_registry/contract_generation/semantic_decomposition/macro_model_challenge/**
      - .github/workflows/macro-model-challenge-iteration3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build iteration 3
        run: python3 research/domain_atlas/compiler/library_registry/contract_generation/semantic_decomposition/macro_model_challenge/build_iteration3.py
      - name: Validate iteration 3 when validator exists
        run: |
          if [ -f research/domain_atlas/compiler/library_registry/contract_generation/semantic_decomposition/macro_model_challenge/validate_iteration3.py ]; then
            python3 research/domain_atlas/compiler/library_registry/contract_generation/semantic_decomposition/macro_model_challenge/validate_iteration3.py
          fi
      - name: Persist iteration-3 artifacts on research branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'shannon-insight-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/domain_atlas/compiler/library_registry/contract_generation/semantic_decomposition/macro_model_challenge/iteration3-*.json \
                  research/domain_atlas/compiler/library_registry/contract_generation/semantic_decomposition/macro_model_challenge/iteration3-*.jsonl
          if git diff --cached --quiet; then
            echo 'Iteration 3 artifacts already current'
            exit 0
          fi
          git commit -m 'research: generate macro-model iteration 3 [skip macro3]'
          git push origin HEAD:${{ github.ref_name }}
      - name: Refuse stale iteration-3 artifacts in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- research/domain_atlas/compiler/library_registry/contract_generation/semantic_decomposition/macro_model_challenge/iteration3-*.json research/domain_atlas/compiler/library_registry/contract_generation/semantic_decomposition/macro_model_challenge/iteration3-*.jsonl
