name: Presentation SOTA Reconcile

on:
  push:
    branches:
      - research/presentation-semantics-sota-2026-08-27

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/presentation-semantics-sota-2026-08-27
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild and validate SOTA presentation semantics
        run: |
          python3 research/product_ontology/inventory_challenges/presentation_experience_gap_audit/sota_semantics/build.py
          python3 research/product_ontology/inventory_challenges/presentation_experience_gap_audit/sota_semantics/validate.py
      - name: Validate canonical parent presentation audit
        run: python3 research/product_ontology/inventory_challenges/presentation_experience_gap_audit/validate.py
      - name: Rebuild and validate corpus architecture router
        run: |
          python3 research/product_ontology/corpus_architecture_router/build_router.py
          python3 research/product_ontology/corpus_architecture_router/validate.py
      - name: Persist deterministic projections
        run: |
          git config user.name "shannon-insight-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/product_ontology/inventory_challenges/presentation_experience_gap_audit/sota_semantics
          git add research/product_ontology/corpus_architecture_router
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: regenerate presentation SOTA projections and routes [skip ci]"
          git push origin HEAD:research/presentation-semantics-sota-2026-08-27
