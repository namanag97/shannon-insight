name: Bootstrap horizontal evidence governance

on:
  push:
    branches:
      - research/horizontal-evidence-governance-20260827
    paths:
      - ".github/workflows/horizontal-evidence-governance.yml"

permissions:
  contents: write

jobs:
  generate-validate-and-route:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/horizontal-evidence-governance-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialize governed source package
        run: python3 .github/bootstrap-horizontal-evidence-governance.py
      - name: Compile evidence-governance source
        run: >-
          python3 -m compileall -q
          research/analytics_landscape/product_families/evidence_governance
      - name: Generate and validate committed evidence ledgers
        run: |
          python3 research/analytics_landscape/product_families/evidence_governance/build.py
          python3 research/analytics_landscape/product_families/evidence_governance/validate.py --check-committed
          python3 research/analytics_landscape/product_families/validate.py
      - name: Regenerate and validate corpus routing
        run: |
          python3 research/product_ontology/corpus_architecture_router/build_router.py
          python3 research/product_ontology/corpus_architecture_router/validate.py
      - name: Validate repository ontology registry
        run: python3 research/product_ontology/validate_registry.py
      - name: Commit governed source and deterministic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: govern horizontal evidence and regenerate routing [skip ci]"
          git push origin HEAD:research/horizontal-evidence-governance-20260827
