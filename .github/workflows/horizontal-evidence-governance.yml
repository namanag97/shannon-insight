name: Horizontal evidence governance

on:
  push:
    paths:
      - "research/analytics_landscape/product_families/**"
      - "research/product_ontology/corpus_architecture_router/**"
      - ".github/workflows/horizontal-evidence-governance.yml"
  pull_request:
    paths:
      - "research/analytics_landscape/product_families/**"
      - "research/product_ontology/corpus_architecture_router/**"
      - ".github/workflows/horizontal-evidence-governance.yml"

permissions:
  contents: read

jobs:
  deterministic-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile governance source
        run: >-
          python3 -m compileall -q
          research/analytics_landscape/product_families/evidence_governance
      - name: Verify committed evidence ledgers
        run: >-
          python3
          research/analytics_landscape/product_families/evidence_governance/build.py
          --check
      - name: Validate evidence governance
        run: >-
          python3
          research/analytics_landscape/product_families/evidence_governance/validate.py
          --check-committed
      - name: Validate horizontal parent corpus
        run: python3 research/analytics_landscape/product_families/validate.py
      - name: Recompute corpus routing and reject drift
        run: |
          python3 research/product_ontology/corpus_architecture_router/build_router.py
          git diff --exit-code -- research/product_ontology/corpus_architecture_router
          python3 research/product_ontology/corpus_architecture_router/validate.py
      - name: Validate repository ontology registry
        run: python3 research/product_ontology/validate_registry.py
