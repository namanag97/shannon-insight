name: CI Mypy Final Repair

on:
  push:
    branches:
      - fix/restore-green-main-after-b07
    paths:
      - .github/workflows/ci-mypy-final-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch the last three mypy findings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one occurrence of {old!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/shannon_insight/syntax/packs/__init__.py',
              'from typing import cast\n\n',
              '',
          )
          replace_once(
              'src/shannon_insight/syntax/packs/__init__.py',
              '            return cast(Parser, _gp(self.name))\n',
              '            return _gp(self.name)\n',
          )
          replace_once(
              'src/shannon_insight/syntax/parser.py',
              '    def _param_names(params_node: Node) -> list[str]:\n',
              '    def _param_names(params_node: Node | None) -> list[str]:\n',
          )
          PY
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check --fix src/ tests/
          ruff format src/ tests/
          mypy src/
          git diff --check
      - name: Commit final parser repairs
        run: |
          git config user.name "shannon-insight-ci-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: close parser type contracts [skip mypy-repair]"
          git push origin HEAD:${{ github.ref_name }}
