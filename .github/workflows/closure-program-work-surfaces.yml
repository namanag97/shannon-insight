name: Closure B16-B20 Work Surfaces

on:
  push:
    branches:
      - 'closure/program-surfaces-*'
    paths:
      - research/product_ontology/closure_program/build_program_work_surfaces.py
      - research/product_ontology/closure_program/validate_program_work_surfaces.py
      - research/product_ontology/closure_program/b1*-*.jsonl
      - research/product_ontology/closure_program/b20-*.jsonl
      - research/product_ontology/closure_program/program-work-surfaces-summary.json
      - .github/workflows/closure-program-work-surfaces.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build program work surfaces
        run: python3 research/product_ontology/closure_program/build_program_work_surfaces.py
      - name: Validate program work surfaces
        run: python3 research/product_ontology/closure_program/validate_program_work_surfaces.py
      - name: Persist surfaces
        run: |
          git config user.name "shannon-insight-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/product_ontology/closure_program/b16-coverage-sampling-frame.jsonl \
                  research/product_ontology/closure_program/b17-intent-solution-challenges.jsonl \
                  research/product_ontology/closure_program/b18-human-effect-obligations.jsonl \
                  research/product_ontology/closure_program/b19-system-fault-obligations.jsonl \
                  research/product_ontology/closure_program/b20-invalidation-obligations.jsonl \
                  research/product_ontology/closure_program/program-work-surfaces-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "closure: generate B16-B20 work surfaces [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
