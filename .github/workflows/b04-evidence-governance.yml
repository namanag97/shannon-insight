name: B04 Horizontal Evidence Governance

on:
  push:
    branches:
      - 'closure/b04-*'
    paths:
      - research/analytics_landscape/product_families/**
      - research/product_ontology/global_boundary_research/**
      - research/product_ontology/closure_program/**
      - research/product_ontology/corpus_architecture_router/**
      - research/domain_atlas/compiler/library_registry/**
      - .github/workflows/b04-evidence-governance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate global boundary corpus
        run: |
          python3 research/product_ontology/global_boundary_research/build_corpus.py
          python3 research/product_ontology/global_boundary_research/validate_corpus.py
      - name: Regenerate governed library registry
        run: python3 research/domain_atlas/compiler/library_registry/generate_registry.py
      - name: Regenerate exact API closure program
        run: |
          python3 research/domain_atlas/compiler/library_registry/exact_api_closure/build_program.py
          python3 research/domain_atlas/compiler/library_registry/exact_api_closure/validate.py
      - name: Regenerate contract generation program
        run: python3 research/domain_atlas/compiler/library_registry/contract_generation/build_program.py
      - name: Diagnose contract wave partition
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path("research/domain_atlas/compiler/library_registry/contract_generation")
          read = lambda name: [json.loads(line) for line in (root / name).read_text(encoding="utf-8").splitlines() if line.strip()]
          packages = read("work-packages.jsonl")
          waves = read("execution-waves.jsonl")
          package_counts = Counter(row["work_package_id"] for row in packages)
          wave_refs = [ref for wave in waves for ref in wave["work_package_refs"]]
          wave_counts = Counter(wave_refs)
          duplicate_packages = {key: value for key, value in package_counts.items() if value > 1}
          duplicate_wave_refs = {key: value for key, value in wave_counts.items() if value > 1}
          missing = sorted(set(package_counts) - set(wave_counts))
          unknown = sorted(set(wave_counts) - set(package_counts))
          print(json.dumps({
              "work_package_rows": len(packages),
              "unique_work_package_ids": len(package_counts),
              "wave_ref_rows": len(wave_refs),
              "unique_wave_refs": len(wave_counts),
              "duplicate_work_package_ids": duplicate_packages,
              "duplicate_wave_refs": duplicate_wave_refs,
              "missing_from_waves": missing,
              "unknown_wave_refs": unknown,
          }, sort_keys=True, indent=2))
          for ref in sorted(set(duplicate_packages) | set(duplicate_wave_refs) | set(missing) | set(unknown)):
              print("DETAIL", ref)
              for row in packages:
                  if row["work_package_id"] == ref:
                      print("PACKAGE", json.dumps(row, sort_keys=True))
              for wave in waves:
                  if ref in wave["work_package_refs"]:
                      print("WAVE", wave["wave_id"], wave["research_families"], wave["work_package_refs"].count(ref))
          PY
      - name: Validate contract generation program
        run: python3 research/domain_atlas/compiler/library_registry/contract_generation/validate.py
      - name: Build and validate evidence governance
        run: |
          python3 research/analytics_landscape/product_families/build_evidence_governance.py
          python3 research/analytics_landscape/product_families/validate.py
          python3 research/analytics_landscape/product_families/validate_evidence_governance.py
          python3 research/analytics_landscape/product_families/build_evidence_upgrade_campaigns.py
          python3 research/analytics_landscape/product_families/validate_evidence_upgrade_campaigns.py
      - name: Recompute closure frontier and routing
        run: |
          python3 research/product_ontology/closure_program/build_master_frontier.py
          python3 research/product_ontology/closure_program/validate_master_frontier.py
          python3 research/product_ontology/corpus_architecture_router/build_router.py
          python3 research/product_ontology/corpus_architecture_router/validate.py
      - name: Validate repository ontology registry
        run: python3 research/product_ontology/validate_registry.py
      - name: Persist canonical regenerated outputs
        run: |
          git config user.name "shannon-insight-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Canonical generated outputs already current"
            exit 0
          fi
          git commit -m "research: regenerate canonical ontology and contract projections [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
