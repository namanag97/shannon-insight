name: CI Repair Autofix

on:
  push:
    branches:
      - 'fix/restore-green-main-after-b07'
    paths:
      - pyproject.toml
      - src/**
      - tests/**
      - .github/workflows/ci-repair-autofix.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.16.5'
      - name: Apply safe lint fixes and formatting
        run: |
          ruff check src/ tests/ --fix || true
          ruff format src/ tests/
      - name: Persist repairs
        run: |
          git config user.name "shannon-insight-ci-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests pyproject.toml
          if git diff --cached --quiet; then
            echo "No automatic Ruff repairs"
            exit 0
          fi
          git commit -m "fix: apply safe Ruff repairs [skip ci-repair]"
          git push origin HEAD:${{ github.ref_name }}
