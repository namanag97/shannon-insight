name: One-shot Fix Python Dependency Relative Imports

on:
  push:
    branches:
      - architecture/shannon-python-product-placement
    paths:
      - .github/workflows/one-shot-fix-python-dependency-relative-imports.yml
  workflow_dispatch:

concurrency:
  group: one-shot-fix-python-dependency-relative-imports
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  patch-generate-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Repair package-relative import resolution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('research/product_ontology/implementation_placement/build_shannon_python_dependency_audit.py')
          text = path.read_text(encoding='utf-8')

          source_pattern = re.compile(
              r'def source_module\(path: Path\) -> str:\n'
              r'(?:    .*\n)+?'
              r'\n\ndef resolve_from_import',
              re.MULTILINE,
          )
          source_replacement = '''def source_module(path: Path) -> str:
              relative = path.relative_to(SRC)
              parts = list(relative.with_suffix("").parts)
              suffix = ".".join(parts)
              return "shannon_insight" + (f".{suffix}" if suffix else "")


          def resolve_from_import'''
          text, source_count = source_pattern.subn(source_replacement, text, count=1)
          if source_count != 1:
              raise SystemExit(f'expected exactly one source_module block, found {source_count}')

          top_pattern = re.compile(
              r'def top_level_internal\(module_name: str \| None\) -> str \| None:\n'
              r'(?:    .*\n)+?'
              r'\n\ndef classify_edge',
              re.MULTILINE,
          )
          top_replacement = '''def top_level_internal(module_name: str | None) -> str | None:
              if not module_name or not module_name.startswith("shannon_insight"):
                  return None
              parts = module_name.split(".")
              if len(parts) <= 1 or parts[1] == "__init__":
                  return "__package_root__"
              return parts[1]


          def classify_edge'''
          text, top_count = top_pattern.subn(top_replacement, text, count=1)
          if top_count != 1:
              raise SystemExit(f'expected exactly one top_level_internal block, found {top_count}')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Generate and validate dependency audit
        run: |
          python3 research/product_ontology/implementation_placement/build_shannon_python_placement.py
          python3 research/product_ontology/implementation_placement/build_shannon_python_dependency_audit.py
          python3 research/product_ontology/implementation_placement/validate_shannon_python_dependency_audit.py
          pytest -q tests/research/test_shannon_python_dependency_audit.py
      - name: Remove one-shot workflow and persist repair
        run: |
          rm .github/workflows/one-shot-fix-python-dependency-relative-imports.yml
          git config user.name 'shannon-insight-architecture-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research/product_ontology/implementation_placement/build_shannon_python_dependency_audit.py \
            research/product_ontology/implementation_placement/shannon-python-dependency-audit.json \
            research/product_ontology/implementation_placement/shannon-python-dependency-edges.jsonl \
            .github/workflows/one-shot-fix-python-dependency-relative-imports.yml
          git commit -m 'fix: resolve package-relative imports in Python dependency audit'
          git push origin HEAD:${{ github.ref_name }}
