name: CI Mypy Root Repair

on:
  push:
    branches:
      - fix/restore-green-main-after-b07
    paths:
      - .github/workflows/ci-mypy-root-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip mypy-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact root-cause repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              file = ROOT / path
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one old fragment, found {count}: {old[:90]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_all(path: str, old: str, new: str, minimum: int = 1) -> None:
              file = ROOT / path
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} fragments, found {count}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          # Dynamic TOML loading preserves Python 3.9 runtime support without redefining an import.
          replace_once(
              "src/shannon_insight/semantics/roles.py",
              "import re\nfrom pathlib import Path\n",
              "import importlib\nimport re\nfrom pathlib import Path\n",
          )
          replace_once(
              "src/shannon_insight/semantics/roles.py",
              '''    try:\n        import tomllib\n    except ImportError:\n        try:\n            import tomli as tomllib  # noqa: F811\n        except ImportError:\n            _ENTRY_POINT_CACHE[root_dir] = entry_points\n            return entry_points\n''',
              '''    try:\n        toml_module = importlib.import_module("tomllib")\n    except ModuleNotFoundError:\n        try:\n            toml_module = importlib.import_module("tomli")\n        except ModuleNotFoundError:\n            _ENTRY_POINT_CACHE[root_dir] = entry_points\n            return entry_points\n    toml_load = getattr(toml_module, "load")\n''',
          )
          replace_once(
              "src/shannon_insight/semantics/roles.py",
              "            data = tomllib.load(f)\n",
              "            data = toml_load(f)\n",
          )

          replace_once(
              "src/shannon_insight/facts/discovery.py",
              "    nested_specs: dict[Path, tuple[str, object]] = {}\n",
              "    nested_specs: dict[Path, pathspec.PathSpec] = {}\n",
          )

          replace_once(
              "src/shannon_insight/infrastructure/runtime.py",
              '''    def __exit__(self, exc_type, exc_val, exc_tb) -> bool:\n        """Exit the runtime context with cleanup."""\n        self._stop(exc_val)\n        return False  # Don't suppress exceptions\n''',
              '''    def __exit__(self, exc_type, exc_val, exc_tb) -> None:\n        """Exit the runtime context with cleanup without suppressing exceptions."""\n        self._stop(exc_val)\n''',
          )
          replace_once(
              "src/shannon_insight/infrastructure/runtime.py",
              '''    async def __aexit__(self, exc_type, exc_val, exc_tb) -> bool:\n        """Async context manager exit."""\n        self._stop(exc_val)\n        return False\n''',
              '''    async def __aexit__(self, exc_type, exc_val, exc_tb) -> None:\n        """Async context manager exit without suppressing exceptions."""\n        self._stop(exc_val)\n''',
          )
          replace_once(
              "src/shannon_insight/infrastructure/runtime.py",
              '''            with open(self._checkpoint_path) as f:\n                checkpoint = json.load(f)\n            return checkpoint.get("data")\n''',
              '''            with open(self._checkpoint_path) as f:\n                checkpoint = json.load(f)\n            data = checkpoint.get("data")\n            return data if isinstance(data, dict) else None\n''',
          )

          replace_once(
              "src/shannon_insight/intake/pipeline.py",
              "def canonicalize_authors_impl(commits, mailmap_content):\n",
              '''def canonicalize_authors_impl(\n    commits: list[CommitFact], mailmap_content: str | None\n) -> tuple[list[CommitFact], list[AuthorRecord]]:\n''',
          )

          replace_once(
              "src/shannon_insight/tensor/core.py",
              "        return self.slice(t, r).nnz / (n * (n - 1))\n",
              "        return float(self.slice(t, r).nnz / (n * (n - 1)))\n",
          )

          replace_once(
              "src/shannon_insight/math/robust.py",
              '''        median_val = np.median(values)\n\n        if isinstance(values, np.ndarray):\n            deviations = np.abs(values - median_val)\n        else:\n            deviations = [abs(x - median_val) for x in values]\n\n        return float(np.median(deviations))\n''',
              '''        array = np.asarray(values, dtype=float)\n        median_val = float(np.median(array))\n        deviations = np.abs(array - median_val)\n        return float(np.median(deviations))\n''',
          )
          replace_once(
              "src/shannon_insight/math/robust.py",
              "            return np.array([o == -1 for o in outliers])  # type: ignore[no-any-return]\n",
              "            return np.asarray([o == -1 for o in outliers], dtype=np.bool_)\n",
          )
          replace_once(
              "src/shannon_insight/math/robust.py",
              '''            return np.array(  # type: ignore[no-any-return]\n                RobustStatistics.iqr_outliers(\n                    values.tolist() if hasattr(values, "tolist") else list(values)\n                )\n            )\n''',
              '''            return np.asarray(\n                RobustStatistics.iqr_outliers(\n                    values.tolist() if hasattr(values, "tolist") else list(values)\n                ),\n                dtype=np.bool_,\n            )\n''',
          )

          replace_once(
              "src/shannon_insight/cross_layer/mutual_info.py",
              "import numpy as np\n",
              "from typing import cast\n\nimport numpy as np\n",
          )
          replace_once(
              "src/shannon_insight/cross_layer/mutual_info.py",
              "        return np.digitize(v, np.linspace(v.min(), v.max(), bins))\n",
              "        return cast(np.ndarray, np.digitize(v, np.linspace(v.min(), v.max(), bins)))\n",
          )
          replace_once(
              "src/shannon_insight/cross_layer/mutual_info.py",
              "    return mi\n",
              "    return float(mi)\n",
          )

          replace_once(
              "src/shannon_insight/algorithms/pagerank.py",
              "    pr = np.ones(n) / n\n",
              "    pr: np.ndarray = np.asarray(np.ones(n) / n, dtype=float)\n",
          )
          replace_once(
              "src/shannon_insight/algorithms/pagerank.py",
              "        pr_new = (1 - damping) / n + damping * (M.T @ pr + dangling_sum)\n",
              '''        pr_new: np.ndarray = np.asarray(\n            (1 - damping) / n + damping * (M.T @ pr + dangling_sum), dtype=float\n        )\n''',
          )
          replace_once(
              "src/shannon_insight/algorithms/pagerank.py",
              "    return pr\n",
              "    return np.asarray(pr, dtype=float)\n",
          )

          replace_once(
              "src/shannon_insight/algorithms/metrics.py",
              "    return max(0.0, min(1.0, gini_value))\n",
              "    return float(max(0.0, min(1.0, float(gini_value))))\n",
          )
          replace_once(
              "src/shannon_insight/algorithms/metrics.py",
              "    return H\n",
              "    return float(H)\n",
          )

          replace_once(
              "src/shannon_insight/tensor/decomposition.py",
              "        return (self.factors[0] + self.factors[1]) / 2.0\n",
              "        return np.asarray((self.factors[0] + self.factors[1]) / 2.0)\n",
          )
          replace_once(
              "src/shannon_insight/tensor/decomposition.py",
              "    new_factor = np.maximum(new_factor, 0.0).astype(np.float32)\n\n    return new_factor\n",
              '''    new_factor = np.asarray(\n        np.maximum(new_factor, 0.0), dtype=np.float32\n    )\n\n    return new_factor\n''',
          )

          replace_once(
              "src/shannon_insight/populate/cochange.py",
              "from collections import Counter\n",
              "from collections import defaultdict\n",
          )
          replace_once(
              "src/shannon_insight/populate/cochange.py",
              '''    cochange_counts: Counter[tuple[str, str]] = Counter()\n    file_counts: Counter[str] = Counter()\n''',
              '''    cochange_counts: dict[tuple[str, str], float] = defaultdict(float)\n    file_counts: dict[str, float] = defaultdict(float)\n''',
          )

          replace_once(
              "src/shannon_insight/cross_layer/conway.py",
              "    return 1 - len(violations) / total_imports\n",
              "    return float(1 - len(violations) / total_imports)\n",
          )

          replace_once(
              "src/shannon_insight/insights/analyzers/spectral.py",
              "        adj = np.zeros((n, n), dtype=float)  # type: ignore[var-annotated]\n",
              "        adj = np.zeros((n, n), dtype=float)\n",
          )
          replace_once(
              "src/shannon_insight/insights/analyzers/spectral.py",
              '''        eigenvalues = np.linalg.eigvalsh(laplacian)\n        eigenvalues = sorted(eigenvalues.tolist())\n''',
              '''        eigenvalue_array = np.linalg.eigvalsh(laplacian)\n        eigenvalues: list[float] = sorted(float(value) for value in eigenvalue_array.tolist())\n''',
          )

          replace_once(
              "src/shannon_insight/insights/kernel.py",
              '''if TYPE_CHECKING:\n    from ..debug_export import DebugExporter\n''',
              '''if TYPE_CHECKING:\n    from ..debug_export import DebugExporter\n    from ..facts.store import FactStore as PersistentFactStore\n''',
          )
          replace_once(
              "src/shannon_insight/insights/kernel.py",
              "        self._facts_db = None  # Lazy-initialized persistent FactStore\n",
              "        self._facts_db: PersistentFactStore | None = None\n",
          )
          replace_once(
              "src/shannon_insight/insights/kernel.py",
              "    def _get_facts_db(self):\n",
              "    def _get_facts_db(self) -> PersistentFactStore | None:\n",
          )

          replace_once(
              "src/shannon_insight/kernel/runtime_kernel.py",
              '''if TYPE_CHECKING:\n    from ..insights.store import AnalysisStore\n    from ..session import AnalysisSession\n''',
              '''if TYPE_CHECKING:\n    from ..facts.store import FactStore as PersistentFactStore\n    from ..insights.store import AnalysisStore\n    from ..session import AnalysisSession\n''',
          )
          replace_once(
              "src/shannon_insight/kernel/runtime_kernel.py",
              "        self._facts_db = None  # Lazy-initialized persistent FactStore\n",
              "        self._facts_db: PersistentFactStore | None = None\n",
          )
          replace_once(
              "src/shannon_insight/kernel/runtime_kernel.py",
              "    def _get_facts_db(self):\n",
              "    def _get_facts_db(self) -> PersistentFactStore | None:\n",
          )

          replace_once(
              "src/shannon_insight/relate/kernel.py",
              "    def _first_file(self, base: str, t: FamilyTable) -> Candidate | None:\n",
              "    def _first_file(\n        self, base: str, t: FamilyTable | tuple[str, ...]\n    ) -> Candidate | None:\n",
          )
          replace_once(
              "src/shannon_insight/relate/kernel.py",
              "                            rel, imp, cand, BindMethod.WORKSPACE_PKG, Confidence.HIGH\n",
              "                            rel, imp, cand.rel_path, BindMethod.WORKSPACE_PKG, Confidence.HIGH\n",
          )
          replace_once(
              "src/shannon_insight/relate/kernel.py",
              '''        hit, others = _pick([self._file_candidates(base, t)], self.index)\n        if hit is None:\n            hit = self._casefold_rescue(rel, imp, base, t, ("",))\n        if hit is not None:\n            return _resolved(rel, imp, hit)\n''',
              '''        hit, _others = _pick([self._file_candidates(base, t)], self.index)\n        if hit is not None:\n            return _resolved(rel, imp, hit)\n        fold = self._casefold_rescue(rel, imp, base, t, ("",))\n        if fold is not None:\n            return fold\n''',
          )
          replace_once(
              "src/shannon_insight/relate/kernel.py",
              '''        if head == "crate":\n            starts = dict.fromkeys((*self._rust_roots, self._crate_root_for(rel)))\n        else:\n            starts = {_up(_parent(rel), ups)}\n''',
              '''        if head == "crate":\n            starts: tuple[str, ...] = tuple(\n                dict.fromkeys((*self._rust_roots, self._crate_root_for(rel)))\n            )\n        else:\n            starts = (_up(_parent(rel), ups),)\n''',
          )

          replace_once(
              "src/shannon_insight/facts/identity.py",
              '''        if ct == ChangeType.ADDED:\n            return self._handle_add(commit_hash, timestamp, change)\n        elif ct == ChangeType.RENAMED:\n            return self._handle_rename(commit_hash, timestamp, change)\n        elif ct == ChangeType.DELETED:\n            return self._handle_delete(commit_hash, timestamp, change)\n        elif ct == ChangeType.MODIFIED:\n            return self._handle_modify(commit_hash, timestamp, change)\n        elif ct == ChangeType.COPIED:\n            # Copy creates a NEW identity (not shared with source).\n            return self._handle_add(commit_hash, timestamp, change)\n        else:\n            # Defensive: treat unknown types as implicit adds.\n            logger.warning(\n                "Unknown change type %s for %s in %s, treating as ADD",\n                ct,\n                change.path,\n                commit_hash,\n            )\n            return self._handle_add(commit_hash, timestamp, change)\n''',
              '''        handler = {\n            ChangeType.ADDED: self._handle_add,\n            ChangeType.RENAMED: self._handle_rename,\n            ChangeType.DELETED: self._handle_delete,\n            ChangeType.MODIFIED: self._handle_modify,\n            # Copy creates a NEW identity rather than sharing the source identity.\n            ChangeType.COPIED: self._handle_add,\n        }.get(ct)\n        if handler is None:\n            logger.warning(\n                "Unknown change type %s for %s in %s, treating as ADD",\n                ct,\n                change.path,\n                commit_hash,\n            )\n            handler = self._handle_add\n        return handler(commit_hash, timestamp, change)\n''',
          )
          replace_all(
              "src/shannon_insight/facts/identity.py",
              "                return row[0]\n",
              "                return str(row[0])\n",
              minimum=2,
          )

          # Tree-sitter nodes are a concrete typed boundary, not arbitrary objects.
          packs_path = ROOT / "src/shannon_insight/syntax/packs/__init__.py"
          packs = packs_path.read_text(encoding="utf-8")
          packs = packs.replace(
              "from collections.abc import Callable\nfrom dataclasses import dataclass, field\n",
              "from collections.abc import Callable\nfrom dataclasses import dataclass, field\nfrom typing import cast\n\nfrom tree_sitter import Node, Parser\n",
              1,
          )
          packs = packs.replace("\nParser = object\n", "\n", 1)
          packs = packs.replace(
              "    import_extractor: Callable[[object, Callable[[object], str]], list[ImportDecl]]\n",
              "    import_extractor: Callable[[Node, Callable[[Node], str]], list[ImportDecl]]\n",
              1,
          )
          packs = packs.replace("            return _gp(self.name)\n", "            return cast(Parser, _gp(self.name))\n", 1)
          packs = packs.replace("            from tree_sitter import Language, Parser\n", "            from tree_sitter import Language\n", 1)
          packs = packs.replace("node: object", "node: Node")
          packs = packs.replace("Callable[[object], str]", "Callable[[Node], str]")
          packs = packs.replace("module, _, alias = raw.partition(\" as \")", "module, _, alias_text = raw.partition(\" as \")", 1)
          packs = packs.replace("alias=alias.strip() or None,", "alias=alias_text.strip() or None,", 1)
          packs = re.sub(r"\s+# type: ignore\[[^\]]+\]", "", packs)
          packs_path.write_text(packs, encoding="utf-8")

          parser_path = ROOT / "src/shannon_insight/syntax/parser.py"
          parser = parser_path.read_text(encoding="utf-8")
          parser = parser.replace(
              "import re\nfrom bisect import bisect_left\nfrom dataclasses import dataclass, field\n",
              "import re\nfrom bisect import bisect_left\nfrom collections.abc import Sequence\nfrom dataclasses import dataclass, field\n",
              1,
          )
          parser = parser.replace(
              '''try:\n    from tree_sitter import Parser\nexcept ImportError as exc:  # pragma: no cover - environment guard\n    raise ImportError("tree-sitter is required for the syntax context") from exc\n''',
              "from tree_sitter import Node, Parser\n",
              1,
          )
          parser = parser.replace("root: object", "root: Node")
          parser = parser.replace("node: object", "node: Node")
          parser = parser.replace("params_node: object", "params_node: Node | None")
          parser = parser.replace("list[object]", "list[Node]")
          parser = parser.replace(
              "    def _visit(self, node: Node, control_depth: int, in_export: bool, children=None) -> None:\n",
              "    def _visit(\n        self,\n        node: Node,\n        control_depth: int,\n        in_export: bool,\n        children: Sequence[Node] | None = None,\n    ) -> None:\n",
              1,
          )
          parser = parser.replace(
              '''    @staticmethod\n    def _static_text(node: Node) -> str:\n        try:\n            return node.text.decode("utf-8")  # type: ignore[attr-defined,union-attr]\n        except AttributeError:\n            return ""\n''',
              '''    @staticmethod\n    def _static_text(node: Node) -> str:\n        raw = node.text\n        return raw.decode("utf-8") if raw is not None else ""\n''',
              1,
          )
          parser = re.sub(r"\s+# type: ignore\[[^\]]+\]", "", parser)
          parser_path.write_text(parser, encoding="utf-8")

          # The unexported FRESH-BUILD runtime duplicated the production kernel and
          # imported a removed fusion API. No repository reference owns it.
          dead_runtime = ROOT / "src/shannon_insight/kernel/runtime.py"
          if not dead_runtime.exists():
              raise SystemExit("expected duplicate kernel/runtime.py to exist")
          dead_runtime.unlink()
          PY
      - name: Format and inspect repairs
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check --fix src/ tests/
          ruff format src/ tests/
          git diff --check
      - name: Commit repairs
        run: |
          git config user.name "shannon-insight-ci-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src pyproject.toml
          if git diff --cached --quiet; then
            echo "No root-cause repairs required"
            exit 0
          fi
          git commit -m "fix: repair typed runtime and parser boundaries [skip mypy-repair]"
          git push origin HEAD:${{ github.ref_name }}
