<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shannon Insight - System Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        * {
            font-family: 'Inter', sans-serif;
        }

        code, .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glow {
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }

        .glow-green {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }

        .glow-amber {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }

        .glow-red {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-float-delayed {
            animation: float 6s ease-in-out infinite;
            animation-delay: -3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .animate-pulse-slow {
            animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .data-flow {
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(99, 102, 241, 0.5) 50%,
                transparent 100%);
            animation: flow 2s linear infinite;
        }

        @keyframes flow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .layer-hover:hover {
            transform: translateX(10px);
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.5);
        }

        .tensor-cell {
            transition: all 0.3s ease;
        }

        .tensor-cell:hover {
            transform: scale(1.2);
            z-index: 10;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ============ COMPONENTS ============

        const Header = () => (
            <header className="py-8 px-6 text-center">
                <h1 className="text-5xl font-bold bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                    Shannon Insight
                </h1>
                <p className="text-xl text-gray-400 mt-3">
                    Codebase Analysis Through Information Theory
                </p>
                <div className="flex justify-center gap-4 mt-6">
                    <span className="px-4 py-1 rounded-full glass text-sm">79+ Signals</span>
                    <span className="px-4 py-1 rounded-full glass text-sm">22 Patterns</span>
                    <span className="px-4 py-1 rounded-full glass text-sm">6 Relationship Types</span>
                </div>
            </header>
        );

        const FundamentalInsight = () => (
            <section className="max-w-5xl mx-auto px-6 py-12">
                <div className="glass rounded-2xl p-8 glow">
                    <h2 className="text-2xl font-semibold text-center mb-6">
                        The Fundamental Insight
                    </h2>
                    <p className="text-center text-xl text-gray-300 mb-8">
                        Code health = alignment between <span className="text-indigo-400 font-semibold">STRUCTURE</span> (what code says)
                        and <span className="text-emerald-400 font-semibold">BEHAVIOR</span> (what developers do)
                    </p>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
                        <InsightCard
                            icon="✓"
                            title="Healthy"
                            desc="Imports match co-changes"
                            color="green"
                        />
                        <InsightCard
                            icon="⚠"
                            title="Hidden Coupling"
                            desc="Co-changes without imports"
                            color="amber"
                        />
                        <InsightCard
                            icon="💀"
                            title="Dead Code"
                            desc="Imports without co-changes"
                            color="red"
                        />
                        <InsightCard
                            icon="🔀"
                            title="Conway Violation"
                            desc="Imports cross team boundaries"
                            color="purple"
                        />
                    </div>
                </div>
            </section>
        );

        const InsightCard = ({ icon, title, desc, color }) => {
            const colors = {
                green: 'border-emerald-500/50 bg-emerald-500/10',
                amber: 'border-amber-500/50 bg-amber-500/10',
                red: 'border-red-500/50 bg-red-500/10',
                purple: 'border-purple-500/50 bg-purple-500/10'
            };

            return (
                <div className={`rounded-xl p-4 border-2 ${colors[color]} text-center transition-transform hover:scale-105`}>
                    <div className="text-3xl mb-2">{icon}</div>
                    <div className="font-semibold text-sm">{title}</div>
                    <div className="text-xs text-gray-400 mt-1">{desc}</div>
                </div>
            );
        };

        const TensorVisualization = () => {
            const [hoveredCell, setHoveredCell] = useState(null);

            const relationships = ['IMPORT', 'COCHANGE', 'AUTHOR', 'SEMANTIC', 'CLONE', 'COMBINED'];
            const times = ['t-3', 't-2', 't-1', 'now'];

            return (
                <section className="max-w-6xl mx-auto px-6 py-12">
                    <h2 className="text-3xl font-bold text-center mb-2">The Tensor</h2>
                    <p className="text-center text-gray-400 mb-8 mono">T ∈ ℝ^(N × N × K × R)</p>

                    <div className="glass rounded-2xl p-8">
                        <div className="flex items-center justify-center gap-8">
                            {/* Tensor visualization */}
                            <div className="relative" style={{ perspective: '1000px' }}>
                                <div className="relative" style={{ transformStyle: 'preserve-3d', transform: 'rotateX(10deg) rotateY(-20deg)' }}>
                                    {/* Stack of matrices */}
                                    {relationships.map((rel, rIdx) => (
                                        <div
                                            key={rel}
                                            className="absolute transition-all duration-300"
                                            style={{
                                                transform: `translateZ(${rIdx * 40}px) translateY(${rIdx * -5}px)`,
                                                opacity: 1 - (rIdx * 0.1)
                                            }}
                                        >
                                            <div className="grid grid-cols-6 gap-1 p-2 rounded-lg"
                                                 style={{ background: `rgba(99, 102, 241, ${0.3 - rIdx * 0.04})` }}>
                                                {[...Array(36)].map((_, i) => (
                                                    <div
                                                        key={i}
                                                        className="w-4 h-4 rounded-sm tensor-cell"
                                                        style={{
                                                            background: Math.random() > 0.7
                                                                ? `rgba(${100 + Math.random()*155}, ${100 + Math.random()*155}, 255, ${0.3 + Math.random()*0.7})`
                                                                : 'rgba(255,255,255,0.05)'
                                                        }}
                                                    />
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Legend */}
                            <div className="space-y-3">
                                <div className="text-sm font-semibold text-gray-300 mb-4">Relationship Types (R)</div>
                                {relationships.map((rel, i) => (
                                    <div key={rel} className="flex items-center gap-3 text-sm">
                                        <div
                                            className="w-4 h-4 rounded"
                                            style={{ background: `rgba(99, 102, 241, ${1 - i * 0.15})` }}
                                        />
                                        <span className="mono text-gray-300">{rel}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="mt-8 text-center text-sm text-gray-400">
                            <span className="mono">T[i, j, t, r]</span> = weight of relationship <span className="text-indigo-400">r</span> from file <span className="text-emerald-400">i</span> to file <span className="text-emerald-400">j</span> at time <span className="text-amber-400">t</span>
                        </div>
                    </div>
                </section>
            );
        };

        const LayerStack = () => {
            const layers = [
                { id: 6, name: 'COMPOSITES', color: 'from-pink-500 to-rose-500', signals: 'risk_score, health_score, codebase_health', icon: '📊' },
                { id: 5, name: 'CROSS-LAYER', color: 'from-purple-500 to-indigo-500', signals: 'behavioral_coherence, hidden_coupling, conway_alignment', icon: '🔗' },
                { id: 4, name: 'TRAJECTORY', color: 'from-indigo-500 to-blue-500', signals: 'pagerank_velocity, community_stability, graph_velocity', icon: '📈' },
                { id: 3, name: 'GRAPH SIGNALS', color: 'from-blue-500 to-cyan-500', signals: 'pagerank, betweenness, modularity, fiedler', icon: '🕸️' },
                { id: 2, name: 'GRAPHS', color: 'from-cyan-500 to-teal-500', signals: 'G_import, G_cochange, G_author, G_semantic, G_clone', icon: '📐' },
                { id: 1, name: 'INDEXED FACTS', color: 'from-teal-500 to-emerald-500', signals: 'events, node_lifecycle, edge_lifecycle, windows', icon: '📇' },
                { id: 0, name: 'RAW EXTRACTION', color: 'from-emerald-500 to-green-500', signals: 'FileSyntax, GitCommit, GitFileChange', icon: '📦' },
            ];

            return (
                <section className="max-w-5xl mx-auto px-6 py-12">
                    <h2 className="text-3xl font-bold text-center mb-2">The Seven-Layer Signal Stack</h2>
                    <p className="text-center text-gray-400 mb-8">Data flows upward through transformation layers</p>

                    <div className="space-y-3">
                        {layers.map((layer, idx) => (
                            <div
                                key={layer.id}
                                className="layer-hover transition-all duration-300 cursor-pointer"
                            >
                                <div className={`bg-gradient-to-r ${layer.color} rounded-xl p-4 flex items-center gap-4`}>
                                    <div className="text-3xl w-12 text-center">{layer.icon}</div>
                                    <div className="flex-1">
                                        <div className="flex items-center gap-3">
                                            <span className="text-xs font-bold bg-black/30 px-2 py-0.5 rounded">L{layer.id}</span>
                                            <span className="font-semibold">{layer.name}</span>
                                        </div>
                                        <div className="text-sm opacity-80 mono mt-1">{layer.signals}</div>
                                    </div>
                                    <div className="text-right text-sm opacity-60">
                                        {idx === 0 ? 'OUTPUT' : '↑'}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Data flow indicator */}
                    <div className="flex justify-center mt-6">
                        <div className="flex items-center gap-2 text-gray-400 text-sm">
                            <span>Source Code + Git</span>
                            <span className="text-2xl">→</span>
                            <span className="text-indigo-400 font-semibold">Insights</span>
                        </div>
                    </div>
                </section>
            );
        };

        const PipelineVisualization = () => {
            const stages = [
                { id: 0, name: 'EXTRACT', time: '1-5min', db: 'facts.db', color: 'emerald' },
                { id: 1, name: 'INDEX', time: '30s-2min', db: 'temporal.db', color: 'teal' },
                { id: 2, name: 'GRAPH', time: '40s-2min', db: 'graph.db', color: 'cyan' },
                { id: 3, name: 'SIGNALS', time: '30s-1.5min', db: 'signals.db', color: 'blue' },
                { id: 4, name: 'PATTERNS', time: '5-60s', db: 'findings.db', color: 'indigo' },
                { id: 5, name: 'SNAPSHOT', time: '5-10s', db: 'snapshots.db', color: 'purple' },
            ];

            return (
                <section className="max-w-6xl mx-auto px-6 py-12">
                    <h2 className="text-3xl font-bold text-center mb-2">Pipeline Execution</h2>
                    <p className="text-center text-gray-400 mb-8">Six stages, each persisted to database</p>

                    <div className="relative">
                        {/* Connection line */}
                        <div className="absolute top-1/2 left-0 right-0 h-1 bg-gradient-to-r from-emerald-500 via-blue-500 to-purple-500 -translate-y-1/2 rounded-full overflow-hidden">
                            <div className="data-flow h-full w-1/3"></div>
                        </div>

                        {/* Stages */}
                        <div className="relative flex justify-between">
                            {stages.map((stage, idx) => (
                                <div key={stage.id} className="flex flex-col items-center">
                                    <div className={`w-16 h-16 rounded-xl bg-${stage.color}-500 flex items-center justify-center text-xl font-bold shadow-lg animate-float`}
                                         style={{ animationDelay: `${idx * 0.2}s` }}>
                                        {stage.id}
                                    </div>
                                    <div className="mt-3 text-center">
                                        <div className="font-semibold text-sm">{stage.name}</div>
                                        <div className="text-xs text-gray-400 mono">{stage.time}</div>
                                    </div>
                                    <div className="mt-2 px-2 py-1 rounded bg-gray-800 text-xs mono">
                                        {stage.db}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Runtime summary */}
                    <div className="mt-12 grid grid-cols-3 gap-4">
                        <RuntimeCard size="Small" files="<100" time="~30s" />
                        <RuntimeCard size="Medium" files="100-1000" time="~3min" />
                        <RuntimeCard size="Large" files="1000-10000" time="~15min" />
                    </div>
                </section>
            );
        };

        const RuntimeCard = ({ size, files, time }) => (
            <div className="glass rounded-xl p-4 text-center">
                <div className="font-semibold">{size}</div>
                <div className="text-sm text-gray-400">{files} files</div>
                <div className="text-2xl font-bold text-indigo-400 mt-2">{time}</div>
            </div>
        );

        const FinderHierarchy = () => {
            const scopes = [
                {
                    name: 'CODEBASE',
                    color: 'purple',
                    finders: ['FLAT_ARCHITECTURE']
                },
                {
                    name: 'MODULE',
                    color: 'indigo',
                    finders: ['ZONE_OF_PAIN', 'ZONE_OF_USELESSNESS', 'BOUNDARY_MISMATCH', 'KNOWLEDGE_SILO', 'UNSTABLE_INTERFACE', 'RIGID_CORE']
                },
                {
                    name: 'PAIR',
                    color: 'blue',
                    finders: ['HIDDEN_COUPLING', 'CONWAY_VIOLATION', 'ACCIDENTAL_COUPLING', 'LAYER_VIOLATION', 'COPY_PASTE_CLONE']
                },
                {
                    name: 'FILE',
                    color: 'cyan',
                    finders: ['GOD_FILE', 'ORPHAN_CODE', 'PHANTOM_DEPENDENCY', 'CIRCULAR_DEPENDENCY', 'HIGH_RISK_HUB', 'WEAK_LINK', 'UNSTABLE_FILE', 'BUS_FACTOR_RISK', 'HOLLOW_CODE', 'CHRONIC_PROBLEM']
                }
            ];

            return (
                <section className="max-w-5xl mx-auto px-6 py-12">
                    <h2 className="text-3xl font-bold text-center mb-2">22 Pattern Finders</h2>
                    <p className="text-center text-gray-400 mb-8">Organized by detection scope</p>

                    <div className="space-y-4">
                        {scopes.map(scope => (
                            <div key={scope.name} className="glass rounded-xl p-4">
                                <div className="flex items-center gap-3 mb-3">
                                    <span className={`px-3 py-1 rounded-full bg-${scope.color}-500/30 text-${scope.color}-300 text-sm font-semibold`}>
                                        {scope.name}
                                    </span>
                                    <span className="text-gray-500 text-sm">{scope.finders.length} patterns</span>
                                </div>
                                <div className="flex flex-wrap gap-2">
                                    {scope.finders.map(finder => (
                                        <span key={finder} className="px-3 py-1 rounded-lg bg-gray-800 text-sm mono hover:bg-gray-700 transition-colors cursor-pointer">
                                            {finder}
                                        </span>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const CrossLayerVisualization = () => {
            const [activeComparison, setActiveComparison] = useState('import-cochange');

            const comparisons = {
                'import-cochange': {
                    left: 'G_import',
                    right: 'G_cochange',
                    metric: 'behavioral_coherence',
                    insight: 'When imports match co-changes, coupling is well-declared'
                },
                'import-author': {
                    left: 'G_import',
                    right: 'G_author',
                    metric: 'conway_alignment',
                    insight: 'When imports align with team ownership, coordination is smooth'
                },
                'import-semantic': {
                    left: 'G_import',
                    right: 'G_semantic',
                    metric: 'semantic_alignment',
                    insight: 'When imports connect related concepts, architecture makes sense'
                }
            };

            const active = comparisons[activeComparison];

            return (
                <section className="max-w-5xl mx-auto px-6 py-12">
                    <h2 className="text-3xl font-bold text-center mb-2">Cross-Layer Analysis</h2>
                    <p className="text-center text-gray-400 mb-8">The key innovation: comparing multiple relationship graphs</p>

                    <div className="glass rounded-2xl p-8">
                        {/* Selector */}
                        <div className="flex justify-center gap-2 mb-8">
                            {Object.keys(comparisons).map(key => (
                                <button
                                    key={key}
                                    onClick={() => setActiveComparison(key)}
                                    className={`px-4 py-2 rounded-lg text-sm transition-all ${
                                        activeComparison === key
                                            ? 'bg-indigo-500 text-white'
                                            : 'bg-gray-800 text-gray-400 hover:bg-gray-700'
                                    }`}
                                >
                                    {key.replace('-', ' ↔ ')}
                                </button>
                            ))}
                        </div>

                        {/* Visualization */}
                        <div className="flex items-center justify-center gap-8">
                            {/* Left graph */}
                            <div className="text-center">
                                <div className="w-32 h-32 rounded-xl bg-indigo-500/20 border-2 border-indigo-500 flex items-center justify-center animate-float">
                                    <GraphIcon />
                                </div>
                                <div className="mt-2 font-semibold text-indigo-400 mono">{active.left}</div>
                                <div className="text-xs text-gray-500">Structure</div>
                            </div>

                            {/* Comparison */}
                            <div className="text-center">
                                <div className="text-4xl mb-2">⟷</div>
                                <div className="px-4 py-2 rounded-lg bg-gradient-to-r from-indigo-500 to-emerald-500 font-semibold">
                                    I(X; Y)
                                </div>
                                <div className="mt-2 text-sm mono text-gray-300">{active.metric}</div>
                            </div>

                            {/* Right graph */}
                            <div className="text-center">
                                <div className="w-32 h-32 rounded-xl bg-emerald-500/20 border-2 border-emerald-500 flex items-center justify-center animate-float-delayed">
                                    <GraphIcon color="emerald" />
                                </div>
                                <div className="mt-2 font-semibold text-emerald-400 mono">{active.right}</div>
                                <div className="text-xs text-gray-500">Behavior</div>
                            </div>
                        </div>

                        {/* Insight */}
                        <div className="mt-8 text-center text-gray-300 max-w-lg mx-auto">
                            💡 {active.insight}
                        </div>
                    </div>
                </section>
            );
        };

        const GraphIcon = ({ color = 'indigo' }) => (
            <svg width="80" height="80" viewBox="0 0 80 80">
                <circle cx="20" cy="20" r="8" fill={color === 'indigo' ? '#818cf8' : '#34d399'} />
                <circle cx="60" cy="20" r="8" fill={color === 'indigo' ? '#818cf8' : '#34d399'} />
                <circle cx="40" cy="50" r="8" fill={color === 'indigo' ? '#818cf8' : '#34d399'} />
                <circle cx="20" cy="60" r="6" fill={color === 'indigo' ? '#818cf8' : '#34d399'} opacity="0.6" />
                <circle cx="60" cy="60" r="6" fill={color === 'indigo' ? '#818cf8' : '#34d399'} opacity="0.6" />
                <line x1="20" y1="20" x2="60" y2="20" stroke={color === 'indigo' ? '#818cf8' : '#34d399'} strokeWidth="2" opacity="0.5" />
                <line x1="20" y1="20" x2="40" y2="50" stroke={color === 'indigo' ? '#818cf8' : '#34d399'} strokeWidth="2" opacity="0.5" />
                <line x1="60" y1="20" x2="40" y2="50" stroke={color === 'indigo' ? '#818cf8' : '#34d399'} strokeWidth="2" opacity="0.5" />
                <line x1="20" y1="60" x2="40" y2="50" stroke={color === 'indigo' ? '#818cf8' : '#34d399'} strokeWidth="2" opacity="0.3" />
                <line x1="60" y1="60" x2="40" y2="50" stroke={color === 'indigo' ? '#818cf8' : '#34d399'} strokeWidth="2" opacity="0.3" />
            </svg>
        );

        const OutputPreview = () => (
            <section className="max-w-4xl mx-auto px-6 py-12">
                <h2 className="text-3xl font-bold text-center mb-8">Sample Output</h2>

                <div className="glass rounded-2xl p-6 font-mono text-sm">
                    <div className="flex items-center justify-between mb-6">
                        <div>
                            <span className="text-gray-500">Codebase Health:</span>
                            <span className="text-4xl font-bold ml-3 text-emerald-400">7.2</span>
                            <span className="text-gray-500">/10</span>
                        </div>
                        <div className="text-right text-gray-500">
                            <div>1,247 files analyzed</div>
                            <div>4,832 commits processed</div>
                        </div>
                    </div>

                    <div className="border-t border-gray-700 pt-4 space-y-3">
                        <FindingRow
                            severity="high"
                            pattern="HIGH_RISK_HUB"
                            target="src/core/engine.py"
                            detail="pagerank=0.94, churn_cv=1.8, bus_factor=1.1"
                        />
                        <FindingRow
                            severity="high"
                            pattern="HIDDEN_COUPLING"
                            target="src/api/handler.py ↔ src/db/queries.py"
                            detail="cochange_lift=4.2, no import"
                        />
                        <FindingRow
                            severity="medium"
                            pattern="ZONE_OF_PAIN"
                            target="src/core/"
                            detail="I=0.82, A=0.15, D=0.67"
                        />
                        <FindingRow
                            severity="medium"
                            pattern="GOD_FILE"
                            target="src/legacy/monolith.py"
                            detail="lines=1847, cognitive_load=89"
                        />
                        <FindingRow
                            severity="low"
                            pattern="ORPHAN_CODE"
                            target="src/utils/deprecated.py"
                            detail="in_degree=0, not entry point"
                        />
                    </div>
                </div>
            </section>
        );

        const FindingRow = ({ severity, pattern, target, detail }) => {
            const colors = {
                high: 'text-red-400 bg-red-500/10',
                medium: 'text-amber-400 bg-amber-500/10',
                low: 'text-blue-400 bg-blue-500/10'
            };

            const icons = {
                high: '🔴',
                medium: '🟡',
                low: '🔵'
            };

            return (
                <div className={`rounded-lg p-3 ${colors[severity]} flex items-start gap-3`}>
                    <span>{icons[severity]}</span>
                    <div className="flex-1">
                        <div className="flex items-center gap-2">
                            <span className="font-semibold">{pattern}</span>
                            <span className="text-gray-500">→</span>
                            <span className="text-gray-300">{target}</span>
                        </div>
                        <div className="text-xs text-gray-500 mt-1">{detail}</div>
                    </div>
                </div>
            );
        };

        const Footer = () => (
