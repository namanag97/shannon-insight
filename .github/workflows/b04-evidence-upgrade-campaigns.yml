name: B04 Evidence Upgrade Campaigns

on:
  pull_request:
    paths:
      - research/analytics_landscape/product_families/**
      - .github/workflows/b04-evidence-upgrade-campaigns.yml
  push:
    branches:
      - main
    paths:
      - research/analytics_landscape/product_families/build_evidence_upgrade_campaigns.py
      - research/analytics_landscape/product_families/organization-family-membership-claims.jsonl
      - research/analytics_landscape/product_families/organization-identity-projection.jsonl
      - research/analytics_landscape/product_families/evidence-upgrade-*.json*
      - .github/workflows/b04-evidence-upgrade-campaigns.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild campaign projection
        run: python3 research/analytics_landscape/product_families/build_evidence_upgrade_campaigns.py
      - name: Validate effective campaign projection
        run: python3 research/analytics_landscape/product_families/validate_evidence_upgrade_campaigns.py
      - name: Refuse stale generated projections
        run: |
          git diff --exit-code -- \
            research/analytics_landscape/product_families/evidence-upgrade-campaigns.jsonl \
            research/analytics_landscape/product_families/evidence-upgrade-campaign-summary.json
