name: Gate and Land CI Repair plus Python Fit

on:
  push:
    branches:
      - fix/restore-green-main-after-b07
    paths:
      - .github/workflows/orchestrate-ci-and-python-fit.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gate-and-land-python-fit
  cancel-in-progress: false

env:
  REPOSITORY: namanag97/shannon-insight
  REPAIR_BRANCH: fix/restore-green-main-after-b07
  FIT_BRANCH: architecture/python-implementation-fit-v2-20260828
  REPAIR_PR: '26'

jobs:
  repair-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src/
      - run: |
          python -m build
          twine check dist/*

  repair-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: pytest tests/ -q

  cleanup-repair-branch:
    needs: [repair-quality, repair-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_BRANCH }}
          fetch-depth: 0
      - run: |
          git config user.name 'shannon-insight-closure-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/ci-repair-autofix.yml \
            .github/workflows/orchestrate-ci-and-python-fit.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: remove temporary repair workflows [skip ci]'
          git push origin HEAD:${REPAIR_BRANCH}

  merge-repair-pr:
    needs: cleanup-repair-branch
    runs-on: ubuntu-latest
    steps:
      - name: Merge verified repair PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "$REPAIR_PR" --repo "$REPOSITORY" --merge --delete-branch

  prepare-fit-branch:
    needs: merge-repair-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FIT_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile fit branch with merged main
        run: |
          git config user.name 'shannon-insight-architecture-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main architecture/python-implementation-fit-20260828
          git merge --no-edit origin/main
      - name: Restore reviewed generated-corpus sources if bootstrap was interrupted
        run: |
          missing=0
          for path in \
            research/implementation_architecture/python_product_fit/module-allocation-rules.json \
            research/implementation_architecture/python_product_fit/build_module_allocation.py \
            research/implementation_architecture/python_product_fit/validate.py
          do
            if [ ! -s "$path" ]; then missing=1; fi
          done
          if [ "$missing" -eq 1 ]; then
            git fetch origin architecture/python-implementation-fit-20260828
            base=origin/architecture/python-implementation-fit-20260828
            for path in \
              research/implementation_architecture/python_product_fit/module-allocation-rules.json \
              research/implementation_architecture/python_product_fit/build_module_allocation.py \
              research/implementation_architecture/python_product_fit/validate.py
            do
              git show "$base:$path" > "$path"
            done
          fi
      - name: Idempotently bind language-role decision into fit manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          here = Path('research/implementation_architecture/python_product_fit')
          builder = here / 'build_module_allocation.py'
          validator = here / 'validate.py'
          if not builder.exists() or not validator.exists():
              raise SystemExit('fit builder/validator missing')

          text = builder.read_text(encoding='utf-8')
          line = '            "language-role-and-packaging.json": sha256_file(HERE / "language-role-and-packaging.json"),\n'
          if line not in text:
              needle = '            "module-allocation-rules.json": sha256_file(HERE / "module-allocation-rules.json"),\n'
              if needle not in text:
                  raise SystemExit('builder manifest insertion point missing')
              text = text.replace(needle, needle + line, 1)
              builder.write_text(text, encoding='utf-8')

          text = validator.read_text(encoding='utf-8')
          load_line = '    language_role = load_json(HERE / "language-role-and-packaging.json")\n'
          if load_line not in text:
              needle = '    rules = load_json(HERE / "module-allocation-rules.json")\n'
              if needle not in text:
                  raise SystemExit('validator load insertion point missing')
              text = text.replace(needle, needle + load_line, 1)

          assertion = '    if language_role.get("completion_claim") is not False:\n'
          if assertion not in text:
              needle = '    if boundary["completion_claim"] is not False:\n        fail("application boundary must not claim completion")\n'
              insert = needle + '    if language_role.get("completion_claim") is not False:\n        fail("language-role decision must not claim completion")\n    if language_role.get("decision") != "RETAIN_PYTHON_AS_APPLICATION_RESEARCH_HARNESS_AND_OPTIONAL_PROVIDER_LANGUAGE_NOT_UNIVERSAL_SEMANTIC_AUTHORITY":\n        fail("Python language-role decision drift")\n    if len(language_role.get("forbidden_collapses", [])) < 8:\n        fail("Python language-role non-collapse laws are incomplete")\n'
              if needle not in text:
                  raise SystemExit('validator assertion insertion point missing')
              text = text.replace(needle, insert, 1)

          manifest_line = '        "language-role-and-packaging.json": sha256_file(HERE / "language-role-and-packaging.json"),\n'
          if manifest_line not in text:
              needle = '        "module-allocation-rules.json": sha256_file(HERE / "module-allocation-rules.json"),\n'
              if needle not in text:
                  raise SystemExit('validator manifest insertion point missing')
              text = text.replace(needle, needle + manifest_line, 1)
          validator.write_text(text, encoding='utf-8')
          PY
      - name: Install package and validators
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply safe formatting to fit tranche
        run: |
          ruff check --fix \
            src/shannon_insight/core/package_identity.py \
            tests/test_package_identity.py \
            tests/research/test_python_implementation_fit.py \
            tests/research/test_python_dependency_provider_fit.py \
            tests/research/test_python_application_pipeline.py \
            research/implementation_architecture/python_product_fit/*.py
          ruff format \
            src/shannon_insight/core/package_identity.py \
            tests/test_package_identity.py \
            tests/research/test_python_implementation_fit.py \
            tests/research/test_python_dependency_provider_fit.py \
            tests/research/test_python_application_pipeline.py \
            research/implementation_architecture/python_product_fit/*.py
      - name: Generate and validate all fit corpora
        run: |
          python3 research/implementation_architecture/python_product_fit/build_module_allocation.py
          python3 research/implementation_architecture/python_product_fit/build_dependency_provider_crosswalk.py
          python3 research/implementation_architecture/python_product_fit/validate.py --determinism
          python3 research/implementation_architecture/python_product_fit/validate_dependency_provider_crosswalk.py --determinism
          python3 research/implementation_architecture/python_product_fit/validate_application_pipeline.py
      - name: Remove transient fit workflows and persist validated state
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/bootstrap-python-fit-v2.yml \
            .github/workflows/finalize-python-implementation-fit.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'architecture: finalize Python implementation fit [skip python-fit] [skip dependency-fit]'
          git push origin HEAD:${FIT_BRANCH}

  fit-quality:
    needs: prepare-fit-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FIT_BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: ruff check src/ tests/ research/implementation_architecture/python_product_fit/*.py
      - run: ruff format --check src/ tests/ research/implementation_architecture/python_product_fit/*.py
      - run: mypy src/
      - run: |
          python3 research/implementation_architecture/python_product_fit/validate.py --determinism
          python3 research/implementation_architecture/python_product_fit/validate_dependency_provider_crosswalk.py --determinism
          python3 research/implementation_architecture/python_product_fit/validate_application_pipeline.py
      - run: |
          python -m build
          twine check dist/*

  fit-tests:
    needs: prepare-fit-branch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FIT_BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: pytest tests/ -q

  merge-fit-pr:
    needs: [fit-quality, fit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Find, ready and merge the verified fit PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$REPOSITORY" --head "$FIT_BRANCH" --state open --json number --jq '.[0].number')
          test -n "$pr"
          gh pr ready "$pr" --repo "$REPOSITORY" || true
          gh pr merge "$pr" --repo "$REPOSITORY" --merge --delete-branch
