name: B07 Current Method Identity Candidates

on:
  push:
    branches:
      - 'closure/b07-current-method-*'
    paths:
      - research/domain_atlas/industries/build_current_method_identity_candidates.py
      - research/domain_atlas/industries/canonical-reference-review-queue.jsonl
      - research/domain_atlas/industries/canonical-reference-auto-alias-candidates.jsonl
      - research/domain_atlas/industries/canonical-reference-adjudications.jsonl
      - research/product_ontology/adjudications/analytical_methods/artifacts.jsonl
      - .github/workflows/b07-current-method-identities.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 research/domain_atlas/industries/build_current_method_identity_candidates.py
      - name: Persist candidates
        run: |
          git config user.name "shannon-insight-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/domain_atlas/industries/canonical-reference-current-method-candidates.jsonl research/domain_atlas/industries/canonical-reference-current-method-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: generate B07 current method identity candidates [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
