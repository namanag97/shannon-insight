name: Qualification Harness Campaign Factoring

on:
  push:
    branches:
      - 'closure/harness-campaigns-*'
    paths:
      - research/product_ontology/qualification_program/build_harness_campaigns.py
      - research/product_ontology/qualification_program/validate_harness_campaigns.py
      - research/product_ontology/qualification_program/qualification-harness-campaigns.jsonl
      - research/product_ontology/qualification_program/contract-scope-harness-bindings.jsonl
      - research/product_ontology/qualification_program/harness-campaign-summary.json
      - .github/workflows/qualification-harness-campaigns.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build B10/B11 harness campaigns
        run: python3 research/product_ontology/qualification_program/build_harness_campaigns.py
      - name: Validate harness campaign partition
        run: python3 research/product_ontology/qualification_program/validate_harness_campaigns.py
      - name: Persist campaigns
        run: |
          git config user.name "shannon-insight-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/product_ontology/qualification_program/qualification-harness-campaigns.jsonl \
                  research/product_ontology/qualification_program/contract-scope-harness-bindings.jsonl \
                  research/product_ontology/qualification_program/harness-campaign-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "closure: generate B10-B11 harness campaigns [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
